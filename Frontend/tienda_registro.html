<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Bellarista Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link href="/css/tienda_auth.css" rel="stylesheet">
</head>
<body>

    <div class="register-card">
        <a href="#" id="logoLink" class="logo">Bella<span>rista</span></a>
        <p class="subtitle">Crear una cuenta nueva de Cliente</p>

        <div id="errorMsg" class="alert-error" style="display: none;"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Su nombre">
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required placeholder="Sus apellidos">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono" required placeholder="987654321">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoDocumento">Tipo Documento</label>
                    <select id="tipoDocumento" name="tipoDocumento">
                        <option value="DNI">DNI (Persona Natural)</option>
                        <option value="RUC">RUC (Empresa)</option>
                        <option value="C.E.">C.E.</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numeroDocumento">Número Documento</label>
                    <input type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Número identificador">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" required placeholder="Av., Calle, Nro., Dpto.">
                </div>
                <div class="form-group">
                    <label for="distrito">Distrito</label>
                    <input type="text" id="distrito" name="distrito" required placeholder="Ej: Miraflores, San Isidro">
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrarme e Ingresar</button>
        </form>

        <div class="card-footer">
            ¿Ya tienes una cuenta? <a href="#" id="loginLink">Inicia sesión aquí</a>
        </div>

        <a href="#" id="backLink" class="back-link">
            &larr; Volver al catálogo
        </a>
    </div>

    <script>
        const API = 'http://15.204.230.215:2451';
        const urlParams = new URLSearchParams(window.location.search);
        const tenantId = urlParams.get('tenantId') || '1';

        // Update URLs dynamically
        document.getElementById('logoLink').href = `/tienda.html?tenantId=${tenantId}`;
        document.getElementById('loginLink').href = `/tienda_login.html?tenantId=${tenantId}`;
        document.getElementById('backLink').href = `/tienda.html?tenantId=${tenantId}`;

        // Fetch tenant details to customize branding
        fetch(API + '/api/tenants/' + tenantId)
            .then(r => r.json())
            .then(tenant => {
                if (tenant) {
                    document.getElementById('logoLink').innerHTML = tenant.nombre_comercial;
                    document.title = 'Registro - ' + tenant.nombre_comercial;
                }
            })
            .catch(err => console.error(err));

        function handleRegister(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const body = {
                nombre: document.getElementById('nombre').value,
                apellidos: document.getElementById('apellidos').value,
                correo: document.getElementById('correo').value,
                telefono: document.getElementById('telefono').value,
                tipoDocumento: document.getElementById('tipoDocumento').value,
                numeroDocumento: document.getElementById('numeroDocumento').value,
                direccion: document.getElementById('direccion').value,
                distrito: document.getElementById('distrito').value,
                tenantId: tenantId
            };

            fetch(API + '/tienda/api/registro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.cliente) {
                    localStorage.setItem('cliente', JSON.stringify(data.cliente));
                    window.location.href = `/tienda.html?tenantId=${tenantId}`;
                } else {
                    errorMsg.textContent = data.error || 'El correo ya se encuentra registrado o hubo un error.';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                console.error(err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            });
        }
    </script>
</body>
</html>
