<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Compra Completada! - Bellarista</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="/css/tienda_success.css" rel="stylesheet">
    <!-- jsPDF and AutoTable libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<body>

    <div class="success-card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        <h1 id="successTitle">¡Compra Realizada!</h1>
        <p id="successDesc">Tu orden ha sido registrada exitosamente. Recibirás un correo electrónico de confirmación con el detalle de la entrega o cita.</p>

        <div style="margin-bottom: 24px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <button id="btnDownload" class="btn-home"
                style="background: var(--primary); display: none; border: none; cursor: pointer; color: white;" onclick="generarBoletaPDF()">
                📄 Ver Boleta PDF
            </button>
            <button id="btnDownloadCita" class="btn-home"
                style="background: #c5a880; display: none; border: none; cursor: pointer; color: white;" onclick="descargarCitaDesdeSuccess()">
                📄 Ver Confirmación de Cita
            </button>
            <a href="#" id="btnHome" class="btn-home">Seguir comprando</a>
        </div>
    </div>

    <!-- Shared storefront JS (cart utils + PDF generator) -->
    <script src="/js/tienda.js"></script>
    <script>
        const successParams = new URLSearchParams(window.location.search);
        const tId = successParams.get('tenantId') || '1';
        document.getElementById('btnHome').href = `/tienda.html?tenantId=${tId}`;

        // Fetch tenant details to customize success message (optional but beautiful)
        fetch(API + '/api/tenants/' + tId)
            .then(r => r.json())
            .then(tenant => {
                if (tenant) {
                    document.title = '¡Compra Completada! - ' + tenant.nombre_comercial;
                    document.getElementById('successDesc').textContent = 'Tu orden ha sido registrada exitosamente en ' + tenant.nombre_comercial + '. Recibirás un correo electrónico de confirmación con el detalle.';
                }
            })
            .catch(err => console.error(err));

        // Parse ventaId from URL query param as integer
        var ventaId = parseInt(successParams.get('ventaId'), 10);
        if (ventaId && !isNaN(ventaId)) {
            document.getElementById('btnDownload').style.display = 'inline-flex';
        }

        // Parse hasServices from URL query param
        var hasServices = successParams.get('hasServices') === 'true';
        if (hasServices) {
            document.getElementById('btnDownloadCita').style.display = 'inline-flex';
        }

        function generarBoletaPDF() {
            if (!ventaId || isNaN(ventaId)) return;
            var btn = document.getElementById('btnDownload');
            btn.textContent = '⏳ Generando...';
            btn.disabled = true;

            // 800ms delay so DB transaction is fully flushed before the fetch
            setTimeout(function () {
                generarBoletaPDFComun(ventaId);
                btn.innerHTML = '📄 Ver Boleta PDF';
                btn.disabled = false;
            }, 800);
        }

        function descargarCitaDesdeSuccess() {
            var btn = document.getElementById('btnDownloadCita');
            btn.textContent = '⏳ Generando...';
            btn.disabled = true;

            const cliente = JSON.parse(localStorage.getItem('cliente') || 'null');
            if (!cliente) {
                alert('No se encontró sesión de cliente activa para descargar la cita.');
                btn.textContent = '📄 Ver Confirmación de Cita';
                btn.disabled = false;
                return;
            }

            fetch(API + '/api/citas')
                .then(r => r.json())
                .then(citas => {
                    const clientCitas = citas.filter(c => c.id_clientes && (c.id_clientes.id_clientes === cliente.id_clientes || c.id_clientes == cliente.id_clientes));
                    if (clientCitas.length === 0) {
                        alert('No se encontró ninguna reserva de cita reciente.');
                        btn.textContent = '📄 Ver Confirmación de Cita';
                        btn.disabled = false;
                        return;
                    }
                    // Sort descending by id_citas to get the most recent one
                    clientCitas.sort((a,b) => b.id_citas - a.id_citas);
                    const latestCitaId = clientCitas[0].id_citas;
                    generarComprobanteCita(latestCitaId);
                    btn.textContent = '📄 Ver Confirmación de Cita';
                    btn.disabled = false;
                })
                .catch(err => {
                    console.error(err);
                    alert('Error al descargar el PDF de la cita.');
                    btn.textContent = '📄 Ver Confirmación de Cita';
                    btn.disabled = false;
                });
        }
    </script>

</body>

</html>
