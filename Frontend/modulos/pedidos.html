<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Pedidos</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Pedido</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Pedido</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cliente</label>
                            <select name="id_clientes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Vendedor/Creador (Usuario)</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero de Pedido</label>
                            <input name="numero_pedido" placeholder="Autogenerado si se deja en blanco">
                        </div>
                        <div class="form-group">
                            <label>Modalidad</label>
                            <select name="modalidad">
                                <option value="delivery" selected>Delivery / Envio</option>
                                <option value="pickup">Retiro en Tienda (Pickup)</option>
                                <option value="presencial">Presencial</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Subtotal (S/)</label>
                            <input name="subtotal" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Costo de Envio (S/)</label>
                            <input name="costo_envio" type="number" step="0.01" value="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Impuesto (S/)</label>
                            <input name="impuesto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Total (S/)</label>
                            <input name="total" type="number" step="0.01" placeholder="0.00" required readonly style="background: #f1f3f5; color: #495057; font-weight: bold; cursor: not-allowed;">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Zona de Delivery</label>
                            <select name="id_zonas_delivery"></select>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Pendiente / Activo</option>
                                <option value="2">Entregado</option>
                                <option value="0">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Direccion de Entrega</label>
                        <input name="direccion_entrega" placeholder="Direccion completa para envio">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Entrega Estimada</label>
                            <input name="fecha_entrega_estimada" type="datetime-local">
                        </div>
                        <div class="form-group">
                            <label>Fecha Entrega Real</label>
                            <input name="fecha_entrega_real" type="datetime-local">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/pedidos',
        [
            { field: 'id_pedidos', pk: true },
            { field: 'numero_pedido' },
            { field: 'id_clientes.nombre_cliente', render: v => v || '-' },
            { field: 'modalidad' },
            { field: 'total', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'id_zonas_delivery.nombre_zona', render: v => v || 'Ninguno' },
            { field: 'estado', render: v => v === 1 ? 'Pendiente' : v === 2 ? 'Entregado' : 'Cancelado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_clientes', type: 'fk' },
            { name: 'numero_pedido', type: 'text' },
            { name: 'modalidad', type: 'text' },
            { name: 'estado', type: 'number' },
            { name: 'subtotal', type: 'decimal' },
            { name: 'costo_envio', type: 'decimal' },
            { name: 'impuesto', type: 'decimal' },
            { name: 'total', type: 'decimal' },
            { name: 'direccion_entrega', type: 'text' },
            { name: 'id_zonas_delivery', type: 'fk' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'fecha_entrega_estimada', type: 'text' },
            { name: 'fecha_entrega_real', type: 'text' }
        ],
        [
            { field: 'id_clientes', api: '/api/clientes', label: 'nombre_cliente' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' },
            { field: 'id_zonas_delivery', api: '/api/zonas_delivery', label: 'nombre_zona' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_pedidos;
                const numero = escapeHtml(row.numero_pedido || '-');
                const cliente = escapeHtml(val(row, 'id_clientes.nombre_cliente', 'Cliente') + ' ' + val(row, 'id_clientes.apellidos_clientes', ''));
                const mod = escapeHtml(row.modalidad || '-');
                const total = row.total != null ? 'S/ ' + parseFloat(row.total).toFixed(2) : '-';
                const envio = row.costo_envio != null ? 'S/ ' + parseFloat(row.costo_envio).toFixed(2) : 'S/ 0.00';
                const dir = escapeHtml(row.direccion_entrega || '-');
                const fallback = numero.slice(0, 2).toUpperCase();

                let estadoText = 'Pendiente';
                let estadoClass = 'badge-warning';
                if (row.estado === 2) { estadoText = 'Entregado'; estadoClass = 'badge-active'; }
                else if (row.estado === 0) { estadoText = 'Cancelado'; estadoClass = 'badge-inactive'; }

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Pedido: ${numero}</h4>
                                    <p>Cliente: ${cliente}</p>
                                </div>
                                <span class="badge ${estadoClass}">${estadoText}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Modalidad</span><strong>${mod.toUpperCase()}</strong></div>
                                <div class="entity-card__meta-item"><span>Total</span><strong>${total}</strong></div>
                                <div class="entity-card__meta-item"><span>Costo Envio</span><strong>${envio}</strong></div>
                                <div class="entity-card__meta-item"><span>Direccion</span><strong>${dir}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );

    document.addEventListener('input', function(e) {
        const name = e.target.name;
        if (name === 'subtotal' || name === 'costo_envio' || name === 'impuesto') {
            const form = e.target.closest('form');
            if (form) {
                const subInput = form.querySelector('input[name="subtotal"]');
                const envioInput = form.querySelector('input[name="costo_envio"]');
                const impInput = form.querySelector('input[name="impuesto"]');
                const totInput = form.querySelector('input[name="total"]');
                
                if (subInput) {
                    const subVal = parseFloat(subInput.value) || 0.0;
                    
                    if (name === 'subtotal' && impInput) {
                        impInput.value = (subVal * 0.18).toFixed(2);
                    }
                    
                    const envioVal = parseFloat(envioInput ? envioInput.value : 0) || 0.0;
                    const impVal = parseFloat(impInput ? impInput.value : 0) || 0.0;
                    
                    const totalVal = subVal + envioVal + impVal;
                    if (totInput) {
                        totInput.value = totalVal.toFixed(2);
                    }
                }
            }
        }
    });
    </script>
</div>
