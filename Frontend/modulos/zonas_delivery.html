<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Zonas de Delivery</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Zona de Delivery</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Sede</label>
                        <select name="id_sedes" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre de la Zona</label>
                            <input name="nombre_zona" required placeholder="Ej: Zona Norte, Zona Centro">
                        </div>
                        <div class="form-group">
                            <label>Distritos (Separados por coma)</label>
                            <input name="distritos" placeholder="Ej: Miraflores, San Isidro, Lince">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Costo Fijo (S/)</label>
                            <input name="costo_fijo" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Monto Minimo Compra (S/)</label>
                            <input name="monto_minimo_compra" type="number" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tiempo Estimado (Minutos)</label>
                            <input name="tiempo_estimado_minutos" type="number" placeholder="Ej: 45">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/zonas_delivery',
        [
            { field: 'id_zonas_delivery', pk: true },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'nombre_zona' },
            { field: 'distritos' },
            { field: 'costo_fijo', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'monto_minimo_compra', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'tiempo_estimado_minutos', render: v => v != null ? v + ' min' : '-' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_sedes', type: 'fk' },
            { name: 'nombre_zona', type: 'text' },
            { name: 'distritos', type: 'text' },
            { name: 'costo_fijo', type: 'decimal' },
            { name: 'monto_minimo_compra', type: 'decimal' },
            { name: 'tiempo_estimado_minutos', type: 'number' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_zonas_delivery;
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', 'Sede no asignada'));
                const zona = escapeHtml(row.nombre_zona || 'Zona');
                const distritos = escapeHtml(row.distritos || '-');
                const costo = row.costo_fijo != null ? 'S/ ' + parseFloat(row.costo_fijo).toFixed(2) : '-';
                const minimo = row.monto_minimo_compra != null ? 'S/ ' + parseFloat(row.monto_minimo_compra).toFixed(2) : '-';
                const tiempo = row.tiempo_estimado_minutos != null ? row.tiempo_estimado_minutos + ' min' : '-';
                const fallback = zona.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${zona}</h4>
                                    <p>Sede: ${sede}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Distritos</span><strong>${distritos}</strong></div>
                                <div class="entity-card__meta-item"><span>Costo Fijo</span><strong>${costo}</strong></div>
                                <div class="entity-card__meta-item"><span>Min. Compra</span><strong>${minimo}</strong></div>
                                <div class="entity-card__meta-item"><span>Tiempo</span><strong>${tiempo}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
