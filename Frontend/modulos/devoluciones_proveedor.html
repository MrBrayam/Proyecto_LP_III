<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Devoluciones a Proveedor</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva Devolucion</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Devolucion a Proveedor</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select name="id_proveedores" required></select>
                        </div>
                        <div class="form-group">
                            <label>Numero Devolucion</label>
                            <input name="numero_devolucion" required placeholder="Ej: DEVP-0001">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Devolucion</label>
                            <input name="fecha_devolucion" type="date" required>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Pendiente / Registrada</option>
                                <option value="2">Enviada</option>
                                <option value="3">Aceptada / Reembolsada</option>
                                <option value="0">Cancelada</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Motivo</label>
                        <input name="motivo" required placeholder="Ej: Producto dañado, Vencido">
                    </div>
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea name="observaciones" placeholder="Notas de la devolucion..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/devoluciones_proveedor',
        [
            { field: 'id_devoluciones_proveedor', pk: true },
            { field: 'numero_devolucion' },
            { field: 'id_proveedores.razon_social', render: v => v || '-' },
            { field: 'fecha_devolucion' },
            { field: 'motivo' },
            { field: 'estado', render: v => v === 1 ? 'Registrada' : v === 2 ? 'Enviada' : v === 3 ? 'Aceptada' : 'Cancelada' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_proveedores', type: 'fk' },
            { name: 'numero_devolucion', type: 'text' },
            { name: 'fecha_devolucion', type: 'text' },
            { name: 'motivo', type: 'text' },
            { name: 'observaciones', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_proveedores', api: '/api/proveedores', label: 'razon_social' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_devoluciones_proveedor;
                const numero = escapeHtml(row.numero_devolucion || '-');
                const prov = escapeHtml(val(row, 'id_proveedores.razon_social', 'Proveedor'));
                const fecha = row.fecha_devolucion || '-';
                const motivo = escapeHtml(row.motivo || '-');
                const fallback = numero.slice(0, 2).toUpperCase();

                let estadoText = 'Registrada';
                let estadoClass = 'badge-warning';
                if (row.estado === 2) { estadoText = 'Enviada'; estadoClass = 'badge-info'; }
                else if (row.estado === 3) { estadoText = 'Aceptada'; estadoClass = 'badge-active'; }
                else if (row.estado === 0) { estadoText = 'Cancelada'; estadoClass = 'badge-inactive'; }

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Devolución: ${numero}</h4>
                                    <p>Proveedor: ${prov} | Fecha: ${fecha}</p>
                                </div>
                                <span class="badge ${estadoClass}">${estadoText}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Motivo</span><strong>${motivo}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
