<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Promociones</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Tipo Descuento</th>
                        <th>Valor</th>
                        <th>Compra Minima</th>
                        <th>Fecha Inicio</th>
                        <th>Fecha Fin</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre Promocion</label>
                        <input name="nombre_promocion" required placeholder="Nombre de la promocion">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Descuento</label>
                            <select name="tipo_descuento">
                                <option value="fijo">Fijo</option>
                                <option value="porcentual">Porcentual</option>
                                <option value="2x1">2x1</option>
                                <option value="3x2">3x2</option>
                                <option value="escalonado">Escalonado</option>
                                <option value="regalo">Regalo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Valor Descuento</label>
                            <input name="valor_descuento" type="number" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Categoria</label>
                            <select name="id_categorias_productos"><option value="">Todas</option></select>
                        </div>
                        <div class="form-group">
                            <label>Compra Minima</label>
                            <input name="compra_minima" type="number" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Inicio</label>
                            <input name="fecha_inicio" type="date">
                        </div>
                        <div class="form-group">
                            <label>Fecha Fin</label>
                            <input name="fecha_fin" type="date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/promociones',
        [
            { field: 'id_promociones', pk: true },
            { field: 'nombre_promocion' },
            { field: 'tipo_descuento' },
            { field: 'valor_descuento', render: v => v != null ? parseFloat(v).toFixed(2) : '-' },
            { field: 'compra_minima', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'fecha_inicio' },
            { field: 'fecha_fin' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_promocion', type: 'text' },
            { name: 'tipo_descuento', type: 'text' },
            { name: 'valor_descuento', type: 'decimal' },
            { name: 'compra_minima', type: 'decimal' },
            { name: 'id_categorias_productos', type: 'fk' },
            { name: 'fecha_inicio', type: 'text' },
            { name: 'fecha_fin', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_categorias_productos', api: '/api/categorias_productos', label: 'nombre_categoria_producto' }
        ]
    );
    </script>
</div>
