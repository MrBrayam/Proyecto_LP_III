<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Gastos Operativos</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Gasto</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Gasto Operativo</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <input type="hidden" name="id_usuarios_usuario_creacion" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sede</label>
                            <select name="id_sedes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select name="id_proveedores"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Concepto Gasto</label>
                            <input name="concepto" required placeholder="Ej: Pago de Luz, Alquiler de local">
                        </div>
                        <div class="form-group">
                            <label>Categoria</label>
                            <select name="categoria">
                                <option value="servicios" selected>Servicios Basicos</option>
                                <option value="alquiler">Alquileres</option>
                                <option value="salarios">Planilla / Honorarios</option>
                                <option value="marketing">Publicidad / Marketing</option>
                                <option value="mantenimiento">Mantenimiento y Reparaciones</option>
                                <option value="otros">Otros Gastos</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Monto Gasto (S/)</label>
                            <input name="monto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha Gasto</label>
                            <input name="fecha_gasto" type="date" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Comprobante Numero</label>
                            <input name="comprobante_numero" placeholder="Ej: F001-00045">
                        </div>
                        <div class="form-group">
                            <label>Usuario Aprobador</label>
                            <select name="id_usuarios_usuario_aprobacion"></select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Detalles adicionales sobre el gasto..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Archivo Evidencia URL</label>
                            <input name="archivo_evidencia" placeholder="URL o enlace al documento de evidencia">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Registrado / Aprobado</option>
                                <option value="0">Pendiente / Rechazado</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/gastos_operativos',
        [
            { field: 'id_gastos_operativos', pk: true },
            { field: 'concepto' },
            { field: 'categoria' },
            { field: 'monto', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'fecha_gasto' },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'estado', render: v => v === 1 ? 'Aprobado' : 'Pendiente' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_sedes', type: 'fk' },
            { name: 'concepto', type: 'text' },
            { name: 'categoria', type: 'text' },
            { name: 'monto', type: 'decimal' },
            { name: 'descripcion', type: 'text' },
            { name: 'id_proveedores', type: 'fk' },
            { name: 'comprobante_numero', type: 'text' },
            { name: 'archivo_evidencia', type: 'text' },
            { name: 'estado', type: 'number' },
            { name: 'id_usuarios_usuario_creacion', type: 'fk' },
            { name: 'id_usuarios_usuario_aprobacion', type: 'fk' },
            { name: 'fecha_gasto', type: 'text' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' },
            { field: 'id_proveedores', api: '/api/proveedores', label: 'razon_social' },
            { field: 'id_usuarios_usuario_creacion', api: '/api/usuarios', label: 'nombre_usuario' },
            { field: 'id_usuarios_usuario_aprobacion', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_gastos_operativos;
                const concepto = escapeHtml(row.concepto || '-');
                const cat = escapeHtml(row.categoria || '-');
                const monto = row.monto != null ? 'S/ ' + parseFloat(row.monto).toFixed(2) : '-';
                const fecha = row.fecha_gasto || '-';
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', 'Sede'));
                const fallback = concepto.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Aprobado</span>'
                    : '<span class="badge badge-inactive">Pendiente</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${concepto}</h4>
                                    <p>Sede: ${sede} | Categoria: ${cat.toUpperCase()}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Fecha</span><strong>${fecha}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
