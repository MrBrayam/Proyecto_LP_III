<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Ventas</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva Venta</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Venta</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sede</label>
                            <select name="id_sedes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Sesion de Caja</label>
                            <select name="id_sesiones_caja" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cliente</label>
                            <select name="id_clientes"></select>
                        </div>
                        <div class="form-group">
                            <label>Vendedor (Usuario)</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero Ticket</label>
                            <input name="numero_ticket" placeholder="Autogenerado si se deja en blanco">
                        </div>
                        <div class="form-group">
                            <label>Comprobante Numero</label>
                            <input name="comprobante_numero" placeholder="Autogenerado si se deja en blanco">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Comprobante</label>
                            <select name="tipo_comprobante">
                                <option value="boleta" selected>Boleta Electronica</option>
                                <option value="factura">Factura Electronica</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado SUNAT</label>
                            <select name="estado_sunat">
                                <option value="pendiente" selected>Pendiente</option>
                                <option value="aceptada">Aceptada</option>
                                <option value="rechazada">Rechazada</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Subtotal (S/)</label>
                            <input name="subtotal" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Descuento (S/)</label>
                            <input name="descuento" type="number" step="0.01" value="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Impuesto (S/)</label>
                            <input name="impuesto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Total (S/)</label>
                            <input name="total" type="number" step="0.01" placeholder="0.00" required readonly style="background: #f1f3f5; color: #495057; font-weight: bold; cursor: not-allowed;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Completada</option>
                            <option value="0">Anulada</option>
                        </select>
                    </div>

                    <!-- Selector de Productos -->
                    <div style="margin-top:1.5rem;">
                        <label style="font-weight:600; margin-bottom:.5rem; display:block;">
                            Productos Vendidos
                            <span style="font-size:.8rem; color:#888; font-weight:400;">(selecciona y define cantidad)</span>
                        </label>
                        <div id="productosContainer"
                             style="max-height:220px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:.5rem; background: #fff;">
                            <div id="loadingProductos" style="text-align:center; color:#888; padding:1rem;">
                                Cargando productos...
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>
    <script>
    let todosProductos = [];

    apiFetch('/api/productos')
        .then(data => {
            todosProductos = data;
        })
        .catch(err => console.error('Error cargando productos:', err));

    function renderProductosSelector(composicion = []) {
        const container = document.getElementById('productosContainer');
        container.innerHTML = '';
        if (todosProductos.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#888;padding:1rem;">No hay productos disponibles</div>';
            return;
        }

        todosProductos.forEach(prod => {
            const compItem = composicion.find(c => c.id_productos && c.id_productos.id_productos === prod.id_productos);
            const isChecked = !!compItem;
            const cantidadVal = isChecked ? compItem.cantidad : 1;

            const div = document.createElement('div');
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.justifyContent = 'space-between';
            div.style.padding = '6px 10px';
            div.style.borderBottom = '1px solid #f1f5f9';

            div.innerHTML = `
                <div style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" value="${prod.id_productos}" ${isChecked ? 'checked' : ''} 
                           onchange="toggleProductRow(${prod.id_productos}, this)" style="cursor:pointer;width:16px;height:16px;">
                    <span style="font-size:13px;font-weight:500;color:#334155;">${prod.nombre_producto}</span>
                    <span style="font-size:11px;color:#64748b;">(S/ ${parseFloat(prod.precio_venta).toFixed(2)})</span>
                </div>
                <div id="cantidadWrap_${prod.id_productos}" style="opacity: ${isChecked ? '1' : '0.4'}; transition: opacity 0.2s;">
                    <label style="font-size:11px;margin-right:6px;color:#64748b;">Cant:</label>
                    <input type="number" id="cant_${prod.id_productos}" min="1" value="${cantidadVal}" ${isChecked ? '' : 'disabled'}
                           data-precio="${prod.precio_venta}" oninput="recalcularPreciosDirectas()"
                           style="width:60px;padding:3px 6px;border:1px solid #cbd5e1;border-radius:4px;font-size:12px;text-align:center;">
                </div>
            `;
            container.appendChild(div);
        });
    }

    window.toggleProductRow = function(pid, cb) {
        const inp = document.getElementById('cant_' + pid);
        const wrap = document.getElementById('cantidadWrap_' + pid);
        if (inp && wrap) {
            inp.disabled = !cb.checked;
            wrap.style.opacity = cb.checked ? '1' : '0.4';
        }
        recalcularPreciosDirectas();
    };

    window.recalcularPreciosDirectas = function() {
        let subtotal = 0.0;
        document.querySelectorAll('#productosContainer input[type="checkbox"]:checked').forEach(cb => {
            const pid = cb.value;
            const cantInp = document.getElementById('cant_' + pid);
            if (cantInp) {
                const precio = parseFloat(cantInp.getAttribute('data-precio')) || 0.0;
                const cant = parseInt(cantInp.value) || 1;
                subtotal += precio * cant;
            }
        });

        const form = document.getElementById('entityForm');
        if (form) {
            const subInput = form.querySelector('input[name="subtotal"]');
            const descInput = form.querySelector('input[name="descuento"]');
            const impInput = form.querySelector('input[name="impuesto"]');
            const totInput = form.querySelector('input[name="total"]');

            if (subInput) {
                subInput.value = subtotal.toFixed(2);
                if (impInput) {
                    impInput.value = (subtotal * 0.18).toFixed(2);
                }
                
                const descVal = parseFloat(descInput ? descInput.value : 0) || 0.0;
                const impVal = parseFloat(impInput ? impInput.value : 0) || 0.0;
                const totalVal = subtotal - descVal + impVal;
                if (totInput) {
                    totInput.value = totalVal.toFixed(2);
                }
            }
        }
    };

    crud.init(
        '/api/ventas',
        [
            { field: 'id_ventas', pk: true },
            { field: 'numero_ticket' },
            { field: 'id_clientes.nombre_cliente', render: v => v || 'Cliente General' },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'tipo_comprobante' },
            { field: 'total', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'estado_sunat' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_sedes', type: 'fk' },
            { name: 'id_sesiones_caja', type: 'fk' },
            { name: 'id_clientes', type: 'fk' },
            { name: 'numero_ticket', type: 'text' },
            { name: 'comprobante_numero', type: 'text' },
            { name: 'tipo_comprobante', type: 'text' },
            { name: 'subtotal', type: 'decimal' },
            { name: 'descuento', type: 'decimal' },
            { name: 'impuesto', type: 'decimal' },
            { name: 'total', type: 'decimal' },
            { name: 'estado', type: 'number' },
            { name: 'estado_sunat', type: 'text' },
            { name: 'id_usuarios', type: 'fk' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' },
            { field: 'id_sesiones_caja', api: '/api/sesiones_caja', label: 'id_sesiones_caja' },
            { field: 'id_clientes', api: '/api/clientes', label: 'nombre_cliente' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_ventas;
                const ticket = escapeHtml(row.numero_ticket || '-');
                const cliente = escapeHtml(val(row, 'id_clientes.nombre_cliente', 'Cliente General') + ' ' + val(row, 'id_clientes.apellidos_clientes', ''));
                const SedeName = escapeHtml(val(row, 'id_sedes.nombre_sede', '-'));
                const tipo = escapeHtml(row.tipo_comprobante || '-');
                const total = row.total != null ? 'S/ ' + parseFloat(row.total).toFixed(2) : '-';
                const subtotal = row.subtotal != null ? 'S/ ' + parseFloat(row.subtotal).toFixed(2) : '-';
                const sunat = escapeHtml(row.estado_sunat || 'pendiente');
                const fallback = ticket.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Completada</span>'
                    : '<span class="badge badge-inactive">Anulada</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Ticket: ${ticket}</h4>
                                    <p>Cliente: ${cliente} | Sede: ${SedeName}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Comprobante</span><strong>${tipo.toUpperCase()}</strong></div>
                                <div class="entity-card__meta-item"><span>Subtotal</span><strong>${subtotal}</strong></div>
                                <div class="entity-card__meta-item"><span>Total</span><strong>${total}</strong></div>
                                <div class="entity-card__meta-item"><span>SUNAT</span><strong>${sunat.toUpperCase()}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );

    const originalOpenNew = crud.openNew;
    crud.openNew = function() {
        originalOpenNew.apply(crud, arguments);
        document.getElementById('modalTitle').textContent = 'Nueva Venta';
        renderProductosSelector([]);
    };

    crud.edit = function(id) {
        crud.editId = id;
        Promise.all([
            apiFetch('/api/ventas/' + id),
            apiFetch('/api/ventas/' + id + '/productos')
        ])
        .then(([venta, composition]) => {
            document.getElementById('modalTitle').textContent = 'Editar Venta';
            crud.openModal();

            const form = document.getElementById('entityForm');
            crud.formConfig.forEach(field => {
                const el = form.elements[field.name];
                if (!el) return;
                
                let val = venta[field.name];
                if (val && typeof val === 'object') {
                    val = val[field.name];
                }
                el.value = val !== null && val !== undefined ? val : '';
            });

            renderProductosSelector(composition);
            recalcularPreciosDirectas();
        })
        .catch(err => {
            console.error('Error cargando venta:', err);
            alert('Error al cargar la venta.');
        });
    };

    crud.save = function() {
        const form = document.getElementById('entityForm');
        
        const ventaData = {
            id_tenants: 1
        };
        
        crud.formConfig.forEach(field => {
            const el = form.elements[field.name];
            if (!el) return;
            let v = el.value;
            if (v === '' || v === null || v === undefined) return;
            
            if (field.type === 'fk') {
                ventaData[field.name] = Number(v);
            } else if (field.type === 'number' || field.type === 'decimal') {
                ventaData[field.name] = field.type === 'decimal' ? parseFloat(v) : Number(v);
            } else {
                ventaData[field.name] = v;
            }
        });

        const detalles = [];
        document.querySelectorAll('#productosContainer input[type="checkbox"]:checked').forEach(cb => {
            const pid = parseInt(cb.value);
            const cantInp = document.getElementById('cant_' + pid);
            if (cantInp) {
                const precio = parseFloat(cantInp.getAttribute('data-precio')) || 0.0;
                const cant = parseInt(cantInp.value) || 1;
                detalles.push({
                    id_productos: pid,
                    cantidad: cant,
                    precio_unitario: precio,
                    subtotal: precio * cant
                });
            }
        });

        if (detalles.length === 0) {
            alert('Debe seleccionar al menos un producto.');
            return;
        }

        const payload = {
            venta: ventaData,
            detalles: detalles
        };

        const method = crud.editId ? 'PUT' : 'POST';
        const url = crud.editId 
            ? '/api/ventas/' + crud.editId + '/con-detalles' 
            : '/api/ventas/con-detalles';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(data => {
            crud.closeModal();
            crud.load();
        })
        .catch(err => {
            console.error('Error guardando venta con productos:', err);
            alert('Error al guardar la venta.');
        });
    };

    document.addEventListener('input', function(e) {
        const name = e.target.name;
        if (name === 'descuento' || name === 'impuesto') {
            recalcularPreciosDirectas();
        }
    });
    </script>
</div>
