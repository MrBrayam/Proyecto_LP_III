<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Proveedores</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Proveedor</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Proveedor</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre Contacto</label>
                            <input name="nombre_proveedor" required placeholder="Nombre del contacto">
                        </div>
                        <div class="form-group">
                            <label>Apellido Contacto</label>
                            <input name="apellido_proveedor" required placeholder="Apellido del contacto">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Razon Social</label>
                            <input name="razon_social" required placeholder="Razon social de la empresa">
                        </div>
                        <div class="form-group">
                            <label>RUC</label>
                            <input name="ruc" required placeholder="Numero de RUC">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Telefono</label>
                            <input name="telefono" placeholder="Ej: 987654321">
                        </div>
                        <div class="form-group">
                            <label>Correo</label>
                            <input name="correo" type="email" placeholder="proveedor@correo.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Direccion</label>
                        <input name="direccion" placeholder="Direccion fiscal o comercial">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/proveedores',
        [
            { field: 'id_proveedores', pk: true },
            { field: 'razon_social' },
            { field: 'ruc' },
            { field: 'nombre_proveedor' },
            { field: 'correo' },
            { field: 'telefono' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_proveedor', type: 'text' },
            { name: 'apellido_proveedor', type: 'text' },
            { name: 'razon_social', type: 'text' },
            { name: 'ruc', type: 'text' },
            { name: 'direccion', type: 'text' },
            { name: 'telefono', type: 'text' },
            { name: 'correo', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_proveedores;
                const razon = escapeHtml(row.razon_social || 'Proveedor');
                const ruc = escapeHtml(row.ruc || '-');
                const contacto = escapeHtml((row.nombre_proveedor || '') + ' ' + (row.apellido_proveedor || ''));
                const correo = escapeHtml(row.correo || '-');
                const telefono = escapeHtml(row.telefono || '-');
                const fallback = razon.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${razon}</h4>
                                    <p>RUC: ${ruc}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Contacto</span><strong>${contacto}</strong></div>
                                <div class="entity-card__meta-item"><span>Correo</span><strong>${correo}</strong></div>
                                <div class="entity-card__meta-item"><span>Telefono</span><strong>${telefono}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
