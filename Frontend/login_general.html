<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellarista - Acceso SuperAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/superadmin_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>Bella<span>rista</span></h1>
                <p>Panel de SuperAdministración</p>
            </div>

            <div id="errorMsg" class="alert-error" style="display: none;"></div>

            <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="off">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="accessToken">Token de Acceso</label>
                    <input type="password" id="accessToken" name="accessToken" required placeholder="Ingrese su access token">
                </div>
                <button type="submit" class="btn-login">
                    Ingresar al Panel
                </button>
            </form>

            <p class="footer-text">Acceso exclusivo para administradores de plataforma</p>
        </div>
    </div>

    <script>
        const API = 'http://15.204.230.215:2451';

        function handleLogin(e) {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const body = {
                email: document.getElementById('email').value,
                accessToken: document.getElementById('accessToken').value
            };

            fetch(API + '/api/superadmin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.superadmin) {
                    localStorage.setItem('superadmin', JSON.stringify(data.superadmin));
                    localStorage.setItem('api_token', data.superadmin.access_token || '');
                    window.location.href = '/superadmin_dashboard.html';
                } else {
                    errorMsg.textContent = data.error || 'Credenciales incorrectas.';
                    errorMsg.style.display = 'block';
                }
            })
            .catch(err => {
                console.error(err);
                errorMsg.textContent = 'Error de conexión con el servidor.';
                errorMsg.style.display = 'block';
            });
        }
    </script>
</body>
</html>
