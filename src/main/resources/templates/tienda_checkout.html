<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasarela de Pago y Checkout - Bellarista</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link href="/css/tienda_checkout.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <a href="/" class="logo">Bella<span>rista</span></a>
            <a href="/" class="back-btn">&larr; Seguir comprando</a>
        </header>

        <div class="checkout-grid">
            <!-- Left Side: Forms -->
            <div>
                <form id="checkoutForm" onsubmit="submitCheckout(event)">
                    <!-- Client Details -->
                    <div class="card">
                        <h3>Datos de Facturación</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Nombre</label>
                                <input type="text" id="nombre" name="nombre" required 
                                       th:value="${cliente != null ? cliente.nombre_cliente : ''}">
                            </div>
                            <div class="form-group">
                                <label>Apellidos</label>
                                <input type="text" id="apellidos" name="apellidos" required
                                       th:value="${cliente != null ? cliente.apellidos_clientes : ''}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Correo Electrónico</label>
                                <input type="email" id="correo" name="correo" required
                                       th:value="${cliente != null ? cliente.correo : ''}">
                            </div>
                            <div class="form-group">
                                <label>Teléfono</label>
                                <input type="text" id="telefono" name="telefono" required
                                       th:value="${cliente != null ? cliente.telefono : ''}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Tipo Documento</label>
                                <select id="tipoDocumento" name="tipoDocumento">
                                    <option value="DNI" th:selected="${cliente != null && cliente.tipo_documento == 'DNI'}">DNI</option>
                                    <option value="RUC" th:selected="${cliente != null && cliente.tipo_documento == 'RUC'}">RUC</option>
                                    <option value="C.E." th:selected="${cliente != null && cliente.tipo_documento == 'C.E.'}">C.E.</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Número Documento</label>
                                <input type="text" id="numeroDocumento" name="numeroDocumento" required
                                       th:value="${cliente != null ? cliente.numero_documento : ''}">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Dirección de Envío</label>
                                <input type="text" id="direccion" name="direccion" required
                                       th:value="${cliente != null ? cliente.direccion : ''}">
                            </div>
                            <div class="form-group">
                                <label>Distrito</label>
                                <input type="text" id="distrito" name="distrito" required
                                       th:value="${cliente != null ? cliente.distrito : ''}">
                            </div>
                        </div>
                    </div>

                    <!-- Payment gateway -->
                    <div class="card">
                        <h3>Pasarela de Pago</h3>
                        <div class="payment-methods">
                            <label class="pay-option active" id="optCard" onclick="selectPayment('card')">
                                <span class="pay-option-icon">💳</span>
                                <span>Tarjeta</span>
                            </label>
                            <label class="pay-option" id="optQr" onclick="selectPayment('qr')">
                                <span class="pay-option-icon">📱</span>
                                <span>Yape / Plin</span>
                            </label>
                        </div>

                        <!-- Card panel details -->
                        <div class="card-details-panel open" id="cardPanel">
                            <div class="form-group">
                                <label>Número de Tarjeta</label>
                                <input type="text" placeholder="xxxx xxxx xxxx xxxx" id="cardNumber">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Fecha Vencimiento</label>
                                    <input type="text" placeholder="MM/AA" id="cardExpiry">
                                </div>
                                <div class="form-group">
                                    <label>CVV / CVC</label>
                                    <input type="password" placeholder="123" id="cardCvv">
                                </div>
                            </div>
                        </div>

                        <!-- QR panel details -->
                        <div class="qr-details-panel" id="qrPanel">
                            <div class="qr-box">
                                <div class="qr-placeholder">
                                    <!-- champagne custom generated beautiful QR -->
                                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=BellaristaStorefrontPayment" alt="QR Pago">
                                </div>
                                <p>Escanea el código QR desde tu app de Yape o Plin para completar el pago de tu compra.</p>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Right Side: Cart Summary -->
            <div class="card" style="position: sticky; top: 100px;">
                <h3>Resumen de Pedido</h3>
                <div class="order-summary-list" id="summaryList">
                    <!-- Dynamically populated -->
                </div>
                <div class="summary-totals">
                    <div class="summary-totals-line">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">S/ 0.00</span>
                    </div>
                    <div class="summary-totals-line">
                        <span>IGV (18%)</span>
                        <span id="summaryIgv">S/ 0.00</span>
                    </div>
                    <div class="summary-totals-line">
                        <span>Costo de Envío</span>
                        <span style="color: var(--success); font-weight: 600;">Gratis</span>
                    </div>
                    <div class="summary-totals-line total">
                        <span>Total</span>
                        <span id="summaryTotal">S/ 0.00</span>
                    </div>
                </div>
                <button type="submit" form="checkoutForm" class="btn-submit-order" style="margin-top: 20px;">
                    Finalizar Compra
                </button>
            </div>
        </div>
    </div>

    <!-- Client-side logic for checkout -->
    <script>
        let cart = [];
        let selectedMethod = 'card';

        document.addEventListener('DOMContentLoaded', () => {
            try {
                cart = JSON.parse(localStorage.getItem('bellarista_cart') || '[]');
            } catch(e) {
                cart = [];
            }

            if (cart.length === 0) {
                alert('No hay productos en el carrito. Redirigiendo a la tienda.');
                window.location.href = '/';
                return;
            }

            renderSummary();
        });

        function selectPayment(method) {
            selectedMethod = method;
            document.querySelectorAll('.pay-option').forEach(o => o.classList.remove('active'));
            if (method === 'card') {
                document.getElementById('optCard').classList.add('active');
                document.getElementById('cardPanel').classList.add('open');
                document.getElementById('qrPanel').classList.remove('open');
            } else {
                document.getElementById('optQr').classList.add('active');
                document.getElementById('qrPanel').classList.add('open');
                document.getElementById('cardPanel').classList.remove('open');
            }
        }

        function renderSummary() {
            const list = document.getElementById('summaryList');
            list.innerHTML = '';

            let total = 0.0;
            cart.forEach(item => {
                total += item.cantidad * item.precio_venta;
                const div = document.createElement('div');
                div.className = 'order-summary-item';
                div.innerHTML = `
                    <div>
                        <span class="summary-item-name">${item.nombre_producto}</span>
                        <span style="color: var(--text-muted); font-size:11px;">x${item.cantidad}</span>
                    </div>
                    <span style="font-weight: 600;">S/ ${(item.cantidad * item.precio_venta).toFixed(2)}</span>
                `;
                list.appendChild(div);
            });

            const sub = total / 1.18;
            const igv = total - sub;

            document.getElementById('summarySubtotal').textContent = 'S/ ' + sub.toFixed(2);
            document.getElementById('summaryIgv').textContent = 'S/ ' + igv.toFixed(2);
            document.getElementById('summaryTotal').textContent = 'S/ ' + total.toFixed(2);
        }

        function submitCheckout(e) {
            e.preventDefault();

            // Prepare Payload
            const body = {
                nombre: document.getElementById('nombre').value,
                apellidos: document.getElementById('apellidos').value,
                correo: document.getElementById('correo').value,
                telefono: document.getElementById('telefono').value,
                tipoDocumento: document.getElementById('tipoDocumento').value,
                numeroDocumento: document.getElementById('numeroDocumento').value,
                direccion: document.getElementById('direccion').value,
                distrito: document.getElementById('distrito').value,
                metodoPago: selectedMethod,
                items: cart.map(item => ({
                    id_productos: item.id_productos,
                    cantidad: item.cantidad,
                    precio_venta: item.precio_venta
                }))
            };

            // Post back to API
            fetch('/tienda/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    // Clear cart
                    localStorage.removeItem('bellarista_cart');
                    // Redirect to success page
                    window.location.href = '/tienda/success';
                } else {
                    console.error('Error detallado del servidor:', data.error);
                    alert('Error al registrar compra: ' + (data.error || 'Intente nuevamente'));
                }
            })
            .catch(err => {
                console.error('Error de red o de ejecución en la pasarela:', err);
                alert('Ocurrió un error en la pasarela de pagos.');
            });
        }
    </script>
</body>
</html>
