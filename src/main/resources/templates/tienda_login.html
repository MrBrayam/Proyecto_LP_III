<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Bellarista Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a880;
            --primary-dark: #b09168;
            --dark: #1e1e24;
            --light: #fdfdfd;
            --gray: #f0f2f5;
            --text-muted: #757577;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5efe6 0%, #ffffff 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a4a4d;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            font-size: 14px;
            background: var(--light);
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary);
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.2);
        }

        .card-footer {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--primary-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--dark);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="/" class="logo">Bella<span>rista</span></a>
        <p class="subtitle">Acceso de Clientes para Compras Online</p>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form method="post" action="/tienda/login">
            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
            </div>
            <div class="form-group">
                <label for="documento">DNI o RUC de Registro</label>
                <input type="text" id="documento" name="documento" required placeholder="Ingrese su número de documento">
            </div>
            <button type="submit" class="btn-submit">Ingresar a la Tienda</button>
        </form>

        <div class="card-footer">
            ¿Aún no tienes cuenta? <a href="/tienda/registro">Regístrate aquí</a>
        </div>

        <a href="/" class="back-link">
            &larr; Volver al catálogo
        </a>
    </div>

</body>
</html>
