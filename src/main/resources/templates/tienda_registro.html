<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliente - Bellarista Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c5a880;
            --primary-dark: #b09168;
            --dark: #1e1e24;
            --light: #fdfdfd;
            --gray: #f0f2f5;
            --text-muted: #757577;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f5efe6 0%, #ffffff 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            border: 1px solid rgba(0, 0, 0, 0.02);
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .logo span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 300;
        }

        .alert-error {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4a4a4d;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            font-size: 14px;
            background: var(--light);
            transition: var(--transition);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(197, 168, 128, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--dark);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary);
            box-shadow: 0 4px 15px rgba(197, 168, 128, 0.2);
        }

        .card-footer {
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--primary-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--dark);
        }

        @media (max-width: 576px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <a href="/" class="logo">Bella<span>rista</span></a>
        <p class="subtitle">Crear una cuenta nueva de Cliente</p>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form method="post" action="/tienda/registro">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Su nombre">
                </div>
                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" required placeholder="Sus apellidos">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" name="telefono" required placeholder="987654321">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="tipoDocumento">Tipo Documento</label>
                    <select id="tipoDocumento" name="tipoDocumento">
                        <option value="DNI">DNI (Persona Natural)</option>
                        <option value="RUC">RUC (Empresa)</option>
                        <option value="C.E.">C.E.</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="numeroDocumento">Número Documento</label>
                    <input type="text" id="numeroDocumento" name="numeroDocumento" required placeholder="Número identificador">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" name="direccion" required placeholder="Av., Calle, Nro., Dpto.">
                </div>
                <div class="form-group">
                    <label for="distrito">Distrito</label>
                    <input type="text" id="distrito" name="distrito" required placeholder="Ej: Miraflores, San Isidro">
                </div>
            </div>

            <button type="submit" class="btn-submit">Registrarme e Ingresar</button>
        </form>

        <div class="card-footer">
            ¿Ya tienes una cuenta? <a href="/tienda/login">Inicia sesión aquí</a>
        </div>

        <a href="/" class="back-link">
            &larr; Volver al catálogo
        </a>
    </div>

</body>
</html>
