<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bellarista - Acceso SuperAdmin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/superadmin_login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h1>Bella<span>rista</span></h1>
                <p>Panel de SuperAdministración</p>
            </div>

            <div th:if="${error}" class="alert-error" th:text="${error}"></div>

            <form method="post" action="/login-general" autocomplete="off">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>
                <div class="form-group">
                    <label for="accessToken">Token de Acceso</label>
                    <input type="password" id="accessToken" name="accessToken" required placeholder="Ingrese su access token">
                </div>
                <button type="submit" class="btn-login">
                    Ingresar al Panel
                </button>
            </form>

            <p class="footer-text">Acceso exclusivo para administradores de plataforma</p>
        </div>
    </div>
</body>
</html>
