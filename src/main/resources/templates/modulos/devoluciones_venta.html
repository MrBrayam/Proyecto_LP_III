<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Devoluciones de Venta</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva Devolucion</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Devolucion</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Venta Relacionada</label>
                            <select name="id_ventas" required></select>
                        </div>
                        <div class="form-group">
                            <label>Usuario Operador</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero Devolucion</label>
                            <input name="numero_devolucion" required placeholder="Ej: DEV-0001">
                        </div>
                        <div class="form-group">
                            <label>Monto Reembolso (S/)</label>
                            <input name="monto_reembolso" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Resolucion</label>
                            <select name="tipo_resolucion">
                                <option value="reembolso_efectivo" selected>Reembolso en Efectivo</option>
                                <option value="cambio_producto">Cambio de Producto</option>
                                <option value="nota_credito">Emision de Nota de Credito</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado Devolucion</label>
                            <select name="estado_devolucion">
                                <option value="pendiente" selected>Pendiente</option>
                                <option value="aprobada">Aprobada</option>
                                <option value="rechazada">Rechazada</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Motivo</label>
                        <input name="motivo" required placeholder="Ej: Defecto de fábrica, Talla incorrecta">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/devoluciones_venta',
        [
            { field: 'id_devoluciones_venta', pk: true },
            { field: 'numero_devolucion' },
            { field: 'id_ventas.numero_ticket', render: v => v || '-' },
            { field: 'motivo' },
            { field: 'tipo_resolucion' },
            { field: 'estado_devolucion' },
            { field: 'monto_reembolso', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_ventas', type: 'fk' },
            { name: 'numero_devolucion', type: 'text' },
            { name: 'motivo', type: 'text' },
            { name: 'tipo_resolucion', type: 'text' },
            { name: 'estado_devolucion', type: 'text' },
            { name: 'monto_reembolso', type: 'decimal' },
            { name: 'id_usuarios', type: 'fk' }
        ],
        [
            { field: 'id_ventas', api: '/api/ventas', label: 'numero_ticket' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_devoluciones_venta;
                const numero = escapeHtml(row.numero_devolucion || '-');
                const ticket = escapeHtml(val(row, 'id_ventas.numero_ticket', 'Venta'));
                const motivo = escapeHtml(row.motivo || '-');
                const resolucion = escapeHtml(row.tipo_resolucion || '-');
                const reembolso = row.monto_reembolso != null ? 'S/ ' + parseFloat(row.monto_reembolso).toFixed(2) : '-';
                const estado = escapeHtml(row.estado_devolucion || 'pendiente');
                const fallback = numero.slice(0, 2).toUpperCase();

                let estadoClass = 'badge-warning';
                if (estado === 'aprobada') estadoClass = 'badge-active';
                else if (estado === 'rechazada') estadoClass = 'badge-inactive';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Devolución: ${numero}</h4>
                                    <p>Ticket Venta: ${ticket}</p>
                                </div>
                                <span class="badge ${estadoClass}">${estado.toUpperCase()}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Motivo</span><strong>${motivo}</strong></div>
                                <div class="entity-card__meta-item"><span>Resolucion</span><strong>${resolucion.toUpperCase()}</strong></div>
                                <div class="entity-card__meta-item"><span>Reembolso</span><strong>${reembolso}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
