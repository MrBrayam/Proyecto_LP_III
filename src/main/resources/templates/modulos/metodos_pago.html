<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Metodos de Pago</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Metodo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Metodo de Pago</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre del Metodo</label>
                            <input name="nombre_metodo_de_pago" required placeholder="Ej: Visa, Mastercard, Yape, Efectivo">
                        </div>
                        <div class="form-group">
                            <label>Tipo Metodo</label>
                            <select name="tipo">
                                <option value="efectivo" selected>Efectivo</option>
                                <option value="tarjeta">Tarjeta de Credito / Debito</option>
                                <option value="billetera_digital">Billetera Digital</option>
                                <option value="transferencia">Transferencia Bancaria</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Detalle adicional sobre comisiones o condiciones..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/metodos_pago',
        [
            { field: 'id_metodos_pago', pk: true },
            { field: 'nombre_metodo_de_pago' },
            { field: 'tipo' },
            { field: 'descripcion' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_metodo_de_pago', type: 'text' },
            { name: 'tipo', type: 'text' },
            { name: 'descripcion', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_metodos_pago;
                const nombre = escapeHtml(row.nombre_metodo_de_pago || 'Metodo');
                const tipo = escapeHtml(row.tipo || '-');
                const desc = escapeHtml(row.descripcion || 'Sin descripcion');
                const fallback = nombre.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${nombre}</h4>
                                    <p>Tipo: ${tipo.toUpperCase()}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Descripcion</span><strong>${desc}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
