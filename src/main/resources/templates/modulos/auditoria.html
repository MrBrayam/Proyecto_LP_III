<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Registro de Auditoria</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros de auditoria</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro de Auditoria</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Usuario</label>
                        <select name="id_usuarios"></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Accion</label>
                            <input name="accion" required placeholder="Ej: CREATE, UPDATE, DELETE">
                        </div>
                        <div class="form-group">
                            <label>Tabla Afectada</label>
                            <input name="tabla_afectada" placeholder="Ej: usuarios, productos">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>ID Registro</label>
                            <input name="id_registro" type="number" placeholder="ID del registro afectado">
                        </div>
                        <div class="form-group">
                            <label>IP Address</label>
                            <input name="ip_address" placeholder="Ej: 192.168.1.1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Datos Anteriores (JSON)</label>
                        <textarea name="datos_anteriores" placeholder='{"campo": "valor_anterior"}'></textarea>
                    </div>
                    <div class="form-group">
                        <label>Datos Nuevos (JSON)</label>
                        <textarea name="datos_nuevos" placeholder='{"campo": "valor_nuevo"}'></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/auditoria',
        [
            { field: 'id_auditoria', pk: true },
            { field: 'id_usuarios.nombre_usuario', render: v => v || 'Sistema' },
            { field: 'accion' },
            { field: 'tabla_afectada' },
            { field: 'id_registro' },
            { field: 'ip_address' },
            { field: 'fecha_hora' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'accion', type: 'text' },
            { name: 'tabla_afectada', type: 'text' },
            { name: 'id_registro', type: 'number' },
            { name: 'datos_anteriores', type: 'text' },
            { name: 'datos_nuevos', type: 'text' },
            { name: 'ip_address', type: 'text' }
        ],
        [
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_auditoria;
                const usuario = escapeHtml(val(row, 'id_usuarios.nombre_usuario', 'Sistema'));
                const accion = escapeHtml(row.accion || '-');
                const tabla = escapeHtml(row.tabla_afectada || '-');
                const regId = row.id_registro != null ? row.id_registro : '-';
                const ip = escapeHtml(row.ip_address || '-');
                const fecha = row.fecha_hora ? new Date(row.fecha_hora).toLocaleString() : '-';
                const fallback = accion.slice(0, 2).toUpperCase();

                let accionClass = '';
                if (accion.toLowerCase().includes('create') || accion.toLowerCase().includes('insert')) accionClass = 'badge-active';
                else if (accion.toLowerCase().includes('delete') || accion.toLowerCase().includes('eliminar')) accionClass = 'badge-inactive';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${accion}</h4>
                                    <p>${tabla} #${regId}</p>
                                </div>
                                <span class="badge ${accionClass}">${accion}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Usuario</span><strong>${usuario}</strong></div>
                                <div class="entity-card__meta-item"><span>IP</span><strong>${ip}</strong></div>
                                <div class="entity-card__meta-item"><span>Fecha</span><strong>${fecha}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Ver Detalle</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
