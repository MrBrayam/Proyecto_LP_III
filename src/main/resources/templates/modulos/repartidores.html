<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Repartidores</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Repartidor</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Usuario / Personal</label>
                        <select name="id_usuarios" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo de Vehiculo</label>
                            <input name="tipo_vehiculo" placeholder="Ej: Moto, Bicicleta, Auto">
                        </div>
                        <div class="form-group">
                            <label>Placa Vehiculo</label>
                            <input name="placa_vehiculo" placeholder="Ej: 1234-AB">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero Licencia</label>
                            <input name="numero_licencia" placeholder="Numero de licencia de conducir">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/repartidores',
        [
            { field: 'id_repartidores', pk: true },
            { field: 'id_usuarios.nombre_usuario', render: v => v || '-' },
            { field: 'tipo_vehiculo' },
            { field: 'placa_vehiculo' },
            { field: 'numero_licencia' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'tipo_vehiculo', type: 'text' },
            { name: 'placa_vehiculo', type: 'text' },
            { name: 'numero_licencia', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_repartidores;
                const nombre = escapeHtml(val(row, 'id_usuarios.nombre_usuario', 'Sin Nombre') + ' ' + val(row, 'id_usuarios.apellidos_usuario', ''));
                const vehiculo = escapeHtml(row.tipo_vehiculo || '-');
                const placa = escapeHtml(row.placa_vehiculo || '-');
                const licencia = escapeHtml(row.numero_licencia || '-');
                const fallback = (val(row, 'id_usuarios.nombre_usuario', 'R')).slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${nombre}</h4>
                                    <p>Vehiculo: ${vehiculo}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Placa</span><strong>${placa}</strong></div>
                                <div class="entity-card__meta-item"><span>Licencia</span><strong>${licencia}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
