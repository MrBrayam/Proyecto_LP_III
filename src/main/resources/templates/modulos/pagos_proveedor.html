<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Pagos a Proveedor</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Registrar Pago</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Registrar Pago a Proveedor</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cuenta por Pagar (Factura)</label>
                            <select name="id_cuentas_por_pagar" required></select>
                        </div>
                        <div class="form-group">
                            <label>Operador (Usuario)</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Monto Pagado (S/)</label>
                            <input name="monto_pagado" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Forma Pago</label>
                            <select name="forma_pago">
                                <option value="transferencia" selected>Transferencia Bancaria</option>
                                <option value="efectivo">Efectivo</option>
                                <option value="cheque">Cheque</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Comprobante de Pago Numero</label>
                            <input name="numero_comprobante" placeholder="Numero de operacion, transferencia, recibo">
                        </div>
                        <div class="form-group">
                            <label>Fecha de Pago</label>
                            <input name="fecha_pago" type="date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea name="observaciones" placeholder="Detalles o notas del pago..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/pagos_proveedor',
        [
            { field: 'id_pagos_proveedor', pk: true },
            { field: 'id_cuentas_por_pagar.documento_numero', render: v => v || '-' },
            { field: 'monto_pagado', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'forma_pago' },
            { field: 'numero_comprobante' },
            { field: 'fecha_pago' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_cuentas_por_pagar', type: 'fk' },
            { name: 'monto_pagado', type: 'decimal' },
            { name: 'forma_pago', type: 'text' },
            { name: 'numero_comprobante', type: 'text' },
            { name: 'fecha_pago', type: 'text' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'observaciones', type: 'text' }
        ],
        [
            { field: 'id_cuentas_por_pagar', api: '/api/cuentas_por_pagar', label: 'documento_numero' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_pagos_proveedor;
                const doc = escapeHtml(val(row, 'id_cuentas_por_pagar.documento_numero', '-'));
                const monto = row.monto_pagado != null ? 'S/ ' + parseFloat(row.monto_pagado).toFixed(2) : '-';
                const forma = escapeHtml(row.forma_pago || '-');
                const comp = escapeHtml(row.numero_comprobante || '-');
                const fecha = row.fecha_pago || '-';
                const fallback = forma.slice(0, 2).toUpperCase();

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Pago: ${forma.toUpperCase()}</h4>
                                    <p>Cuenta Doc: ${doc}</p>
                                </div>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Fecha</span><strong>${fecha}</strong></div>
                                <div class="entity-card__meta-item"><span>Comprobante</span><strong>${comp}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
