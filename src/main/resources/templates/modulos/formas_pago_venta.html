<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Formas de Pago Venta</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Registrar Pago</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro de Pago</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Venta</label>
                        <select name="id_ventas" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Pago</label>
                            <select name="tipo_pago">
                                <option value="efectivo" selected>Efectivo</option>
                                <option value="tarjeta_credito">Tarjeta de Credito</option>
                                <option value="tarjeta_debito">Tarjeta de Debito</option>
                                <option value="transferencia">Transferencia Bancaria</option>
                                <option value="billetera_digital">Billetera Digital (Yape/Plin)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto Pago (S/)</label>
                            <input name="monto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Referencia Transaccion</label>
                        <input name="referencia_transaccion" placeholder="Numero de operacion, referencia bancaria">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/formas_pago_venta',
        [
            { field: 'id_formas_pago_venta', pk: true },
            { field: 'id_ventas.numero_ticket', render: v => v || '-' },
            { field: 'tipo_pago' },
            { field: 'monto', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'referencia_transaccion' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_ventas', type: 'fk' },
            { name: 'tipo_pago', type: 'text' },
            { name: 'monto', type: 'decimal' },
            { name: 'referencia_transaccion', type: 'text' }
        ],
        [
            { field: 'id_ventas', api: '/api/ventas', label: 'numero_ticket' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_formas_pago_venta;
                const ticket = escapeHtml(val(row, 'id_ventas.numero_ticket', 'Venta'));
                const tipo = escapeHtml(row.tipo_pago || '-');
                const monto = row.monto != null ? 'S/ ' + parseFloat(row.monto).toFixed(2) : '-';
                const ref = escapeHtml(row.referencia_transaccion || 'Sin referencia');
                const fallback = tipo.slice(0, 2).toUpperCase();

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Pago: ${tipo.toUpperCase()}</h4>
                                    <p>Ticket Venta: ${ticket}</p>
                                </div>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Referencia</span><strong>${ref}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
