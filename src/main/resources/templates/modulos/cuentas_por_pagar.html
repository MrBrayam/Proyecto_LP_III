<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Cuentas por Pagar</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva Cuenta</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Cuenta por Pagar</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select name="id_proveedores" required></select>
                        </div>
                        <div class="form-group">
                            <label>Numero de Documento</label>
                            <input name="documento_numero" required placeholder="Ej: F001-00045">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Documento</label>
                            <select name="tipo_documento">
                                <option value="factura" selected>Factura</option>
                                <option value="boleta">Boleta</option>
                                <option value="recibo">Recibo</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Monto (S/)</label>
                            <input name="monto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Documento</label>
                            <input name="fecha_documento" type="date" required>
                        </div>
                        <div class="form-group">
                            <label>Fecha Vencimiento</label>
                            <input name="fecha_vencimiento" type="date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado Pago</label>
                        <select name="estado_pago">
                            <option value="pendiente" selected>Pendiente</option>
                            <option value="pagado">Pagado</option>
                            <option value="vencido">Vencido</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/cuentas_por_pagar',
        [
            { field: 'id_cuentas_por_pagar', pk: true },
            { field: 'documento_numero' },
            { field: 'id_proveedores.razon_social', render: v => v || '-' },
            { field: 'monto', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'fecha_vencimiento' },
            { field: 'estado_pago' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_proveedores', type: 'fk' },
            { name: 'documento_numero', type: 'text' },
            { name: 'tipo_documento', type: 'text' },
            { name: 'monto', type: 'decimal' },
            { name: 'fecha_documento', type: 'text' },
            { name: 'fecha_vencimiento', type: 'text' },
            { name: 'estado_pago', type: 'text' }
        ],
        [
            { field: 'id_proveedores', api: '/api/proveedores', label: 'razon_social' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_cuentas_por_pagar;
                const docNum = escapeHtml(row.documento_numero || '-');
                const prov = escapeHtml(val(row, 'id_proveedores.razon_social', 'Proveedor'));
                const tipo = escapeHtml(row.tipo_documento || '-');
                const monto = row.monto != null ? 'S/ ' + parseFloat(row.monto).toFixed(2) : '-';
                const vcto = row.fecha_vencimiento || '-';
                const estado = escapeHtml(row.estado_pago || 'pendiente');
                const fallback = docNum.slice(0, 2).toUpperCase();

                let estadoClass = 'badge-warning';
                if (estado === 'pagado') estadoClass = 'badge-active';
                else if (estado === 'vencido') estadoClass = 'badge-inactive';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Doc: ${docNum} (${tipo.toUpperCase()})</h4>
                                    <p>Proveedor: ${prov}</p>
                                </div>
                                <span class="badge ${estadoClass}">${estado.toUpperCase()}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Vencimiento</span><strong>${vcto}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
