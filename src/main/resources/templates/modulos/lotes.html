<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Lotes de Inventario</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lote</th>
                        <th>Producto</th>
                        <th>Almacen</th>
                        <th>Cantidad</th>
                        <th>Disponible</th>
                        <th>Precio Unit.</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Producto</label>
                        <select name="id_productos"></select>
                    </div>
                    <div class="form-group">
                        <label>Almacen</label>
                        <select name="id_almacenes"></select>
                    </div>
                    <div class="form-group">
                        <label>Numero de Lote</label>
                        <input name="numero_lote" placeholder="Numero de lote">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Cantidad</label>
                            <input name="cantidad" type="number" placeholder="Cantidad">
                        </div>
                        <div class="form-group">
                            <label>Cantidad Disponible</label>
                            <input name="cantidad_disponible" type="number" placeholder="Disponible">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio Unitario</label>
                            <input name="precio_unitario" type="number" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Proveedor</label>
                            <select name="id_proveedores"><option value="">Ninguno</option></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Vencimiento</label>
                            <input name="fecha_vencimiento" type="date">
                        </div>
                        <div class="form-group">
                            <label>Fecha Ingreso</label>
                            <input name="fecha_ingreso" type="date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea name="observaciones" placeholder="Observaciones"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/lotes_inventario',
        [
            { field: 'id_lotes_inventario', pk: true },
            { field: 'numero_lote' },
            { field: 'id_productos.nombre_producto', render: v => v || '-' },
            { field: 'id_almacenes.nombre_almacen', render: v => v || '-' },
            { field: 'cantidad' },
            { field: 'cantidad_disponible' },
            { field: 'precio_unitario', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_productos', type: 'fk' },
            { name: 'id_almacenes', type: 'fk' },
            { name: 'numero_lote', type: 'text' },
            { name: 'cantidad', type: 'number' },
            { name: 'cantidad_disponible', type: 'number' },
            { name: 'precio_unitario', type: 'decimal' },
            { name: 'id_proveedores', type: 'fk' },
            { name: 'fecha_vencimiento', type: 'text' },
            { name: 'fecha_ingreso', type: 'text' },
            { name: 'observaciones', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_productos', api: '/api/productos', label: 'nombre_producto' },
            { field: 'id_almacenes', api: '/api/almacenes', label: 'nombre_almacen' },
            { field: 'id_proveedores', api: '/api/proveedores', label: 'nombre_proveedor' }
        ]
    );
    </script>
</div>
