<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Notificaciones</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Notificacion</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Usuario Destinatario</label>
                        <select name="id_usuarios" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Notificacion</label>
                            <select name="tipo">
                                <option value="sistema" selected>Sistema</option>
                                <option value="stock_bajo">Stock Bajo</option>
                                <option value="cita_pendiente">Cita Pendiente</option>
                                <option value="pago_vencido">Pago Vencido</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Canal Envio</label>
                            <select name="canal_envio">
                                <option value="sistema" selected>Sistema / Web</option>
                                <option value="correo">Correo Electronico</option>
                                <option value="whatsapp">WhatsApp</option>
                                <option value="sms">SMS</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Titulo</label>
                        <input name="titulo" required placeholder="Titulo de la notificacion">
                    </div>
                    <div class="form-group">
                        <label>Mensaje</label>
                        <textarea name="mensaje" required placeholder="Contenido del mensaje..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Estado de Lectura</label>
                            <select name="estado_lectura">
                                <option value="no_leido" selected>No Leido</option>
                                <option value="leido">Leido</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha Lectura</label>
                            <input name="fecha_lectura" type="datetime-local">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/notificaciones',
        [
            { field: 'id_notificaciones', pk: true },
            { field: 'id_usuarios.nombre_usuario', render: v => v || '-' },
            { field: 'tipo' },
            { field: 'titulo' },
            { field: 'canal_envio' },
            { field: 'estado_lectura' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'tipo', type: 'text' },
            { name: 'titulo', type: 'text' },
            { name: 'mensaje', type: 'text' },
            { name: 'canal_envio', type: 'text' },
            { name: 'estado_lectura', type: 'text' },
            { name: 'fecha_lectura', type: 'text' }
        ],
        [
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_notificaciones;
                const destinatario = escapeHtml(val(row, 'id_usuarios.nombre_usuario', 'Sistema'));
                const tipo = escapeHtml(row.tipo || '-');
                const titulo = escapeHtml(row.titulo || '-');
                const mensaje = escapeHtml(row.mensaje || '');
                const canal = escapeHtml(row.canal_envio || '-');
                const fallback = tipo.slice(0, 2).toUpperCase();
                const leido = row.estado_lectura === 'leido'
                    ? '<span class="badge badge-active">Leido</span>'
                    : '<span class="badge badge-inactive">No Leido</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${titulo}</h4>
                                    <p>Para: ${destinatario} | Canal: ${canal}</p>
                                </div>
                                ${leido}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Tipo</span><strong>${tipo.toUpperCase()}</strong></div>
                                <div class="entity-card__meta-item"><span>Mensaje</span><strong>${mensaje.length > 80 ? mensaje.substring(0, 80) + '...' : mensaje}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
