<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Sesiones de Caja</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Aperturar Caja</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Aperturar / Editar Sesion de Caja</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sede</label>
                            <select name="id_sedes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Cajero (Usuario)</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Monto Inicial Apertura (S/)</label>
                            <input name="monto_inicial" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Monto Final Cierre (S/)</label>
                            <input name="monto_final" type="number" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Diferencia (S/)</label>
                            <input name="diferencia" type="number" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Abierta</option>
                                <option value="0">Cerrada</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Apertura</label>
                            <input name="fecha_apertura" type="datetime-local">
                        </div>
                        <div class="form-group">
                            <label>Fecha Cierre</label>
                            <input name="fecha_cierre" type="datetime-local">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea name="observaciones" placeholder="Detalles de cuadre, observaciones..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/sesiones_caja',
        [
            { field: 'id_sesiones_caja', pk: true },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'id_usuarios.nombre_usuario', render: v => v || '-' },
            { field: 'monto_inicial', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'monto_final', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'diferencia', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'estado', render: v => v === 1 ? 'Abierta' : 'Cerrada' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_sedes', type: 'fk' },
            { name: 'id_usuarios', type: 'fk' },
            { name: 'monto_inicial', type: 'decimal' },
            { name: 'monto_final', type: 'decimal' },
            { name: 'diferencia', type: 'decimal' },
            { name: 'estado', type: 'number' },
            { name: 'fecha_apertura', type: 'text' },
            { name: 'fecha_cierre', type: 'text' },
            { name: 'observaciones', type: 'text' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_sesiones_caja;
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', 'Sede'));
                const cajero = escapeHtml(val(row, 'id_usuarios.nombre_usuario', 'Cajero'));
                const inicial = row.monto_inicial != null ? 'S/ ' + parseFloat(row.monto_inicial).toFixed(2) : '-';
                const finalVal = row.monto_final != null ? 'S/ ' + parseFloat(row.monto_final).toFixed(2) : '-';
                const dif = row.diferencia != null ? 'S/ ' + parseFloat(row.diferencia).toFixed(2) : '-';
                const fallback = 'CJ';

                let estadoText = 'Abierta';
                let estadoClass = 'badge-active';
                if (row.estado === 0) { estadoText = 'Cerrada'; estadoClass = 'badge-inactive'; }

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>Sesión de Caja #${id}</h4>
                                    <p>Sede: ${sede} | Cajero: ${cajero}</p>
                                </div>
                                <span class="badge ${estadoClass}">${estadoText}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto Inicial</span><strong>${inicial}</strong></div>
                                <div class="entity-card__meta-item"><span>Monto Final</span><strong>${finalVal}</strong></div>
                                <div class="entity-card__meta-item"><span>Diferencia</span><strong>${dif}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar / Cerrar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
