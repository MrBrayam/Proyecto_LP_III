<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Movimientos de Inventario</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Lote</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Motivo</th>
                        <th>Referencia</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Lote de Inventario</label>
                        <select name="id_lotes_inventario"></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Movimiento</label>
                            <select name="tipo_movimiento">
                                <option value="entrada">Entrada</option>
                                <option value="salida">Salida</option>
                                <option value="ajuste">Ajuste</option>
                                <option value="transferencia">Transferencia</option>
                                <option value="merma">Merma</option>
                                <option value="devolucion">Devolucion</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Cantidad</label>
                            <input name="cantidad" type="number" placeholder="Cantidad">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Motivo</label>
                        <input name="motivo" placeholder="Motivo del movimiento">
                    </div>
                    <div class="form-group">
                        <label>Referencia Documento</label>
                        <input name="referencia_documento" placeholder="Documento de referencia">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/movimientos_inventario',
        [
            { field: 'id_movimientos_inventario', pk: true },
            { field: 'id_lotes_inventario.numero_lote', render: v => v || '-' },
            { field: 'tipo_movimiento' },
            { field: 'cantidad' },
            { field: 'motivo' },
            { field: 'referencia_documento' },
            { field: 'fecha_movimiento' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_lotes_inventario', type: 'fk' },
            { name: 'tipo_movimiento', type: 'text' },
            { name: 'cantidad', type: 'number' },
            { name: 'motivo', type: 'text' },
            { name: 'referencia_documento', type: 'text' }
        ],
        [
            { field: 'id_lotes_inventario', api: '/api/lotes_inventario', label: 'numero_lote' }
        ]
    );
    </script>
</div>
