<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Movimientos de Caja Chica</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Movimiento</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Movimiento de Caja Chica</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sesion de Caja</label>
                            <select name="id_sesiones_caja" required></select>
                        </div>
                        <div class="form-group">
                            <label>Usuario (Responsable)</label>
                            <select name="id_usuarios" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Concepto / Tipo</label>
                            <input name="concepto" required placeholder="Ej: Pasajes, Utiles de limpieza">
                        </div>
                        <div class="form-group">
                            <label>Monto (S/)</label>
                            <input name="monto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Detalle del gasto menor..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>URL o Evidencia del Comprobante</label>
                        <input name="comprobante_url" placeholder="Enlace a la imagen o PDF del comprobante">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/caja_chica',
        [
            { field: 'id_caja_chica', pk: true },
            { field: 'id_sesiones_caja.id_sesiones_caja', render: v => v ? 'Sesion #' + v : '-' },
            { field: 'concepto' },
            { field: 'monto', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'id_usuarios.nombre_usuario', render: v => v || '-' },
            { field: 'fecha_registro' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_sesiones_caja', type: 'fk' },
            { name: 'concepto', type: 'text' },
            { name: 'monto', type: 'decimal' },
            { name: 'descripcion', type: 'text' },
            { name: 'comprobante_url', type: 'text' },
            { name: 'id_usuarios', type: 'fk' }
        ],
        [
            { field: 'id_sesiones_caja', api: '/api/sesiones_caja', label: 'id_sesiones_caja' },
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_caja_chica;
                const concepto = escapeHtml(row.concepto || '-');
                const sesion = escapeHtml(val(row, 'id_sesiones_caja.id_sesiones_caja', '-'));
                const monto = row.monto != null ? 'S/ ' + parseFloat(row.monto).toFixed(2) : '-';
                const usuario = escapeHtml(val(row, 'id_usuarios.nombre_usuario', '-'));
                const fecha = row.fecha_registro ? new Date(row.fecha_registro).toLocaleString() : '-';
                const fallback = concepto.slice(0, 2).toUpperCase();

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${concepto}</h4>
                                    <p>Sesion de Caja: #${sesion} | Por: ${usuario}</p>
                                </div>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Fecha</span><strong>${fecha}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
