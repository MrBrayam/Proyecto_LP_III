<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Series de Comprobantes</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva Serie</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Serie de Comprobante</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Comprobante</label>
                            <select name="tipo_comprobante">
                                <option value="boleta" selected>Boleta Electronica</option>
                                <option value="factura">Factura Electronica</option>
                                <option value="nota_credito">Nota de Credito</option>
                                <option value="nota_debito">Nota de Debito</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Punto Emision</label>
                            <input name="punto_emision" type="number" placeholder="Ej: 1" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero Serie</label>
                            <input name="numero_serie" required placeholder="Ej: F001, B001">
                        </div>
                        <div class="form-group">
                            <label>Proximo Numero</label>
                            <input name="numero_proximo" type="number" value="1" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Autorizacion</label>
                            <input name="fecha_autorizacion" type="date">
                        </div>
                        <div class="form-group">
                            <label>Fecha Vencimiento</label>
                            <input name="fecha_vencimiento" type="date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/series_comprobantes',
        [
            { field: 'id_series_comprobantes', pk: true },
            { field: 'tipo_comprobante' },
            { field: 'punto_emision' },
            { field: 'numero_serie' },
            { field: 'numero_proximo' },
            { field: 'fecha_vencimiento' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'tipo_comprobante', type: 'text' },
            { name: 'punto_emision', type: 'number' },
            { name: 'numero_serie', type: 'text' },
            { name: 'numero_proximo', type: 'number' },
            { name: 'fecha_autorizacion', type: 'text' },
            { name: 'fecha_vencimiento', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_series_comprobantes;
                const tipo = escapeHtml(row.tipo_comprobante || '-');
                const punto = row.punto_emision != null ? String(row.punto_emision).padStart(3, '0') : '000';
                const serie = escapeHtml(row.numero_serie || '-');
                const proximo = row.numero_proximo != null ? String(row.numero_proximo).padStart(8, '0') : '00000001';
                const vencimiento = row.fecha_vencimiento || '-';
                const fallback = tipo.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${tipo.toUpperCase()} (${serie})</h4>
                                    <p>Punto Emision: ${punto} | Proximo Correlativo: ${proximo}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Vencimiento</span><strong>${vencimiento}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
