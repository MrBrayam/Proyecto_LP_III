<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Preferencias de Usuario</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Preferencia</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Usuario</label>
                        <select name="id_usuarios"></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Idioma</label>
                            <select name="idioma">
                                <option value="es" selected>Espanol</option>
                                <option value="en">Ingles</option>
                                <option value="pt">Portugues</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Formato Fecha</label>
                            <select name="formato_fecha">
                                <option value="DD/MM/YYYY" selected>DD/MM/YYYY</option>
                                <option value="MM/DD/YYYY">MM/DD/YYYY</option>
                                <option value="YYYY-MM-DD">YYYY-MM-DD</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Zona Horaria</label>
                            <input name="zona_horaria" placeholder="Ej: America/Lima">
                        </div>
                        <div class="form-group">
                            <label>Tema Interfaz</label>
                            <select name="tema_interfaz">
                                <option value="claro" selected>Claro</option>
                                <option value="oscuro">Oscuro</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Notificaciones Activas</label>
                            <select name="notificaciones_activas">
                                <option value="1" selected>Si</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Vista Inicial</label>
                            <input name="vista_inicial" placeholder="Ej: dashboard, productos">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/preferencias_usuario',
        [
            { field: 'id_preferencias_usuario', pk: true },
            { field: 'id_usuarios.nombre_usuario', render: v => v || '-' },
            { field: 'idioma' },
            { field: 'tema_interfaz' },
            { field: 'notificaciones_activas', render: v => v === 1 ? 'Si' : 'No' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_usuarios', type: 'fk' },
            { name: 'idioma', type: 'text' },
            { name: 'formato_fecha', type: 'text' },
            { name: 'zona_horaria', type: 'text' },
            { name: 'notificaciones_activas', type: 'number' },
            { name: 'vista_inicial', type: 'text' },
            { name: 'tema_interfaz', type: 'text' }
        ],
        [
            { field: 'id_usuarios', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_preferencias_usuario;
                const usuario = escapeHtml(val(row, 'id_usuarios.nombre_usuario', '-'));
                const idioma = escapeHtml(row.idioma || 'es');
                const tema = escapeHtml(row.tema_interfaz || 'claro');
                const notif = row.notificaciones_activas === 1 ? 'Si' : 'No';
                const zona = escapeHtml(row.zona_horaria || '-');
                const fallback = usuario.slice(0, 2).toUpperCase();

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${usuario}</h4>
                                    <p>Preferencias de interfaz</p>
                                </div>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Idioma</span><strong>${idioma}</strong></div>
                                <div class="entity-card__meta-item"><span>Tema</span><strong>${tema}</strong></div>
                                <div class="entity-card__meta-item"><span>Notificaciones</span><strong>${notif}</strong></div>
                                <div class="entity-card__meta-item"><span>Zona Horaria</span><strong>${zona}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
