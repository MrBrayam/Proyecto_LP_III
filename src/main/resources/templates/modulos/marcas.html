<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Marcas</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards brand-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre de Marca</label>
                        <input name="nombre_marca" required placeholder="Nombre de la marca">
                    </div>
                    <div class="form-group">
                        <label>Logo de Marca</label>
                        <input type="hidden" name="logo_url">
                        <input type="file" accept="image/*" data-file-target="logo_url">
                        <small class="form-help">Selecciona un logo desde tu PC.</small>
                        <img class="image-preview" data-preview-for="logo_url" alt="Vista previa del logo">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Pais de Origen</label>
                            <input name="pais_origen" placeholder="Pais">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Descripcion"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/marcas',
        [
            { field: 'id_marcas', pk: true },
            { field: 'nombre_marca' },
            { field: 'pais_origen' },
            { field: 'logo_url' },
            { field: 'descripcion' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_marca', type: 'text' },
            { name: 'logo_url', type: 'text' },
            { name: 'pais_origen', type: 'text' },
            { name: 'descripcion', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            fileFields: [
                { target: 'logo_url', previewSelector: '[data-preview-for="logo_url"]', uploadUrl: '/api/uploads/image' }
            ],
            cardRenderer: function(row) {
                const id = row.id_marcas;
                const nombre = escapeHtml(row.nombre_marca || 'Marca');
                const pais = escapeHtml(row.pais_origen || '-');
                const descripcion = escapeHtml(row.descripcion || 'Sin descripción');
                const imagen = resolveCardImageUrl(row.logo_url, nombre, 'logo_url');
                const fallback = nombre.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';
                const logoBlock = imagen
                    ? `<img class="brand-card__logo" src="${escapeHtml(imagen)}" alt="${nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="brand-card__logo-fallback" style="display:none;">${fallback}</div>`
                    : `<div class="brand-card__logo-fallback">${fallback}</div>`;

                return `
                    <article class="entity-card brand-card">
                        <div class="brand-card__accent"></div>
                        <div class="brand-card__top">
                            <div class="brand-card__logo-wrap">${logoBlock}</div>
                            <div class="brand-card__title-block">
                                <div class="entity-card__header">
                                    <div>
                                        <h4>${nombre}</h4>
                                        <p>${pais}</p>
                                    </div>
                                    ${estado}
                                </div>
                                <div class="brand-card__chips">
                                    <span class="brand-card__chip">Marca</span>
                                    <span class="brand-card__chip brand-card__chip--soft">ID ${id}</span>
                                </div>
                            </div>
                        </div>
                        <div class="brand-card__body">
                            <p class="entity-card__description">${descripcion}</p>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
