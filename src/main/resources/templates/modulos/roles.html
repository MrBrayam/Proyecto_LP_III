<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Roles Personalizados</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">

                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">

                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre del Rol</label>
                        <input name="nombre_rol_personalizado" required placeholder="Ej: Administrador de Sede">
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Descripcion del rol y sus responsabilidades"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>

                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="usuarios"> Usuarios
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="tenants"> Tenants
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="roles"> Roles
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="permisos"> Permisos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="usuario-sedes"> Usuario-Sedes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="preferencias"> Preferencias
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="auditoria"> Auditoria
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="clientes"> Clientes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="citas"> Citas
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="repartidores"> Repartidores
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="sedes"> Sedes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="horarios-operacion"> Horarios
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="zonas-delivery"> Delivery
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="notificaciones"> Notificaciones
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="ventas"> Ventas
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="pedidos"> Pedidos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="devoluciones-venta"> Devoluciones Venta
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="formas-pago-venta"> Formas de Pago
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="comprobantes-electronicos"> Comprobantes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="series-comprobantes"> Series Comprobantes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="ordenes-compra"> Órdenes de Compra
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="proveedores"> Proveedores
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="proveedores-categorias"> Cat. Proveedor
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="devoluciones-proveedor"> Dev. Proveedor
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="cuentas-por-pagar"> Cuentas por Pagar

                                <input type="checkbox" name="permissions_check" value="caja-chica"> Caja Chica
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="sesiones-caja"> Sesiones de Caja
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="metodos-pago"> Métodos de Pago
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="gastos-operativos"> Gastos Operativos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="gastos-recurrentes"> Gastos Recurrentes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="productos"> Productos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="categorias"> Categorías
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="marcas"> Marcas
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="almacenes"> Almacenes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="lotes"> Lotes
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="movimientos"> Movimientos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="combos"> Combos
                            </label>
                            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: normal; cursor: pointer;">
                                <input type="checkbox" name="permissions_check" value="promociones"> Promociones
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/roles_personalizados',
        [
            { field: 'id_roles_personalizados', pk: true },
            { field: 'nombre_rol_personalizado' },
            { field: 'descripcion' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_rol_personalizado', type: 'text' },
            { name: 'descripcion', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_roles_personalizados;
                const nombre = escapeHtml(row.nombre_rol_personalizado || 'Rol');
                const desc = escapeHtml(row.descripcion || 'Sin descripcion');
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${nombre}</h4>
                                    <p>${desc.length > 60 ? desc.substring(0, 60) + '...' : desc}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );

    // 1. Intercept openNew para limpiar los checkbox de permisos
    const originalOpenNew = crud.openNew;
    crud.openNew = function() {
        originalOpenNew.call(crud);
        document.querySelectorAll('input[name="permissions_check"]').forEach(cb => cb.checked = false);
    };

    // 2. Intercept edit para marcar los checkbox con los permisos actuales del rol
    const originalEdit = crud.edit;
    crud.edit = function(id) {
        document.querySelectorAll('input[name="permissions_check"]').forEach(cb => cb.checked = false);
        
        apiFetch('/api/permisos_rol').then(perms => {
            const rolePerms = perms.filter(p => p.id_roles_personalizados 
                && p.id_roles_personalizados.id_roles_personalizados === id
                && p.estado === 1);
            
            rolePerms.forEach(p => {
                const cb = document.querySelector(`input[name="permissions_check"][value="${p.modulo}"]`);
                if (cb) cb.checked = true;
            });
        }).catch(err => console.error('Error cargando permisos del rol:', err));

        originalEdit.call(crud, id);
    };

    // 3. Sobrescribir save para guardar el rol y luego sincronizar sus permisos
    crud.save = function() {
        const form = document.getElementById('entityForm');
        const checkedModules = Array.from(document.querySelectorAll('input[name="permissions_check"]:checked'))
            .map(cb => cb.value);

        const data = {};
        for (const field of this.formConfig) {
            const el = form.elements[field.name];
            if (!el) continue;
            let v = el.value;
            if (v === '' || v === null || v === undefined) continue;
            if (field.type === 'fk') {
                data[field.name] = { [field.name]: Number(v) };
            } else if (field.type === 'number' || field.type === 'decimal') {
                data[field.name] = field.type === 'decimal' ? parseFloat(v) : Number(v);
            } else {
                data[field.name] = v;
            }
        }

        const method = this.editId ? 'PUT' : 'POST';
        const url = this.editId ? this.apiUrl + '/' + this.editId : this.apiUrl;

        apiFetch(url, { method, body: JSON.stringify(data) }).then(async (response) => {
            const rolId = response.id_roles_personalizados;

            try {
                // Obtener permisos actuales para eliminarlos antes de recrear (sincronización)
                const currentPerms = await apiFetch('/api/permisos_rol');
                const rolePermsToDelete = currentPerms.filter(p => p.id_roles_personalizados 
                    && p.id_roles_personalizados.id_roles_personalizados === rolId);

                // Eliminar permisos antiguos
                for (const p of rolePermsToDelete) {
                    await apiFetch('/api/permisos_rol/' + p.id_permisos_rol, { method: 'DELETE' });
                }

                // Guardar los nuevos permisos seleccionados
                for (const mod of checkedModules) {
                    const permPayload = {
                        id_roles_personalizados: { id_roles_personalizados: rolId },
                        modulo: mod,
                        accion: 'visualizar',
                        recurso: 'modulo',
                        estado: 1
                    };
                    await apiFetch('/api/permisos_rol', { method: 'POST', body: JSON.stringify(permPayload) });
                }
            } catch (e) {
                console.error('Error sincronizando permisos del rol:', e);
            }

            this.closeModal();
            this.load();
        }).catch(err => {
            console.error(err);
            alert(err.message);
        });
    };
    </script>
</div>
