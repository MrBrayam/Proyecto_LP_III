<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Gastos Recurrentes</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Gasto Recurrente</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Gasto Recurrente</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sede</label>
                            <select name="id_sedes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Concepto</label>
                            <input name="concepto" required placeholder="Ej: Servicio de Agua, Alquiler mensual">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Monto Estimado (S/)</label>
                            <input name="monto" type="number" step="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-group">
                            <label>Frecuencia de Registro</label>
                            <select name="frecuencia">
                                <option value="mensual" selected>Mensual</option>
                                <option value="bimestral">Bimestral</option>
                                <option value="trimestral">Trimestral</option>
                                <option value="anual">Anual</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha Proximo Registro</label>
                            <input name="fecha_proximo_registro" type="date" required>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo / Programado</option>
                                <option value="0">Inactivo / Pausado</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/gastos_recurrentes',
        [
            { field: 'id_gastos_recurrentes', pk: true },
            { field: 'concepto' },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'monto', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'frecuencia' },
            { field: 'fecha_proximo_registro' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_sedes', type: 'fk' },
            { name: 'concepto', type: 'text' },
            { name: 'monto', type: 'decimal' },
            { name: 'frecuencia', type: 'text' },
            { name: 'fecha_proximo_registro', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_gastos_recurrentes;
                const concepto = escapeHtml(row.concepto || '-');
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', 'Sede'));
                const monto = row.monto != null ? 'S/ ' + parseFloat(row.monto).toFixed(2) : '-';
                const freq = escapeHtml(row.frecuencia || '-');
                const prox = row.fecha_proximo_registro || '-';
                const fallback = concepto.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Programado</span>'
                    : '<span class="badge badge-inactive">Pausado</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${concepto}</h4>
                                    <p>Sede: ${sede} | Frecuencia: ${freq.toUpperCase()}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Monto</span><strong>${monto}</strong></div>
                                <div class="entity-card__meta-item"><span>Proximo Pago</span><strong>${prox}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
