<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Permisos de Rol</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Permiso</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Rol</label>
                        <select name="id_roles_personalizados"></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Modulo</label>
                            <input name="modulo" required placeholder="Ej: productos, ventas, clientes">
                        </div>
                        <div class="form-group">
                            <label>Accion</label>
                            <select name="accion">
                                <option value="crear">Crear</option>
                                <option value="editar">Editar</option>
                                <option value="eliminar">Eliminar</option>
                                <option value="visualizar">Visualizar</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Recurso</label>
                            <input name="recurso" placeholder="Recurso especifico (opcional)">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/permisos_rol',
        [
            { field: 'id_permisos_rol', pk: true },
            { field: 'id_roles_personalizados.nombre_rol_personalizado', render: v => v || '-' },
            { field: 'modulo' },
            { field: 'accion' },
            { field: 'recurso' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_roles_personalizados', type: 'fk' },
            { name: 'modulo', type: 'text' },
            { name: 'accion', type: 'text' },
            { name: 'recurso', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_roles_personalizados', api: '/api/roles_personalizados', label: 'nombre_rol_personalizado' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_permisos_rol;
                const rol = escapeHtml(val(row, 'id_roles_personalizados.nombre_rol_personalizado', '-'));
                const modulo = escapeHtml(row.modulo || '-');
                const accion = escapeHtml(row.accion || '-');
                const recurso = escapeHtml(row.recurso || '-');
                const fallback = modulo.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${modulo} - ${accion}</h4>
                                    <p>Rol: ${rol}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Recurso</span><strong>${recurso}</strong></div>
                                <div class="entity-card__meta-item"><span>Accion</span><strong>${accion}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
