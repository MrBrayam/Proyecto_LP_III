<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Horarios de Operacion</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Horario</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <div class="form-group">
                        <label>Sede</label>
                        <select name="id_sedes" required></select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Dia Semana</label>
                            <select name="dia_semana">
                                <option value="lunes" selected>Lunes</option>
                                <option value="martes">Martes</option>
                                <option value="miercoles">Miercoles</option>
                                <option value="jueves">Jueves</option>
                                <option value="viernes">Viernes</option>
                                <option value="sabado">Sabado</option>
                                <option value="domingo">Domingo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Hora Apertura</label>
                            <input name="hora_apertura" type="time" required>
                        </div>
                        <div class="form-group">
                            <label>Hora Cierre</label>
                            <input name="hora_cierre" type="time" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/horarios_operacion',
        [
            { field: 'id_horarios_operacion', pk: true },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'dia_semana' },
            { field: 'hora_apertura' },
            { field: 'hora_cierre' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_sedes', type: 'fk' },
            { name: 'dia_semana', type: 'text' },
            { name: 'hora_apertura', type: 'text' },
            { name: 'hora_cierre', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_horarios_operacion;
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', 'Sede'));
                const dia = escapeHtml(row.dia_semana || '-');
                const apertura = row.hora_apertura || '-';
                const cierre = row.hora_cierre || '-';
                const fallback = dia.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${dia.toUpperCase()}</h4>
                                    <p>Sede: ${sede}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Apertura</span><strong>${apertura}</strong></div>
                                <div class="entity-card__meta-item"><span>Cierre</span><strong>${cierre}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
