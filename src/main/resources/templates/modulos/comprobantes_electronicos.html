<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Comprobantes Electronicos</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo Comprobante</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Comprobante</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Venta Asociada</label>
                            <select name="id_ventas" required></select>
                        </div>
                        <div class="form-group">
                            <label>Tipo Comprobante</label>
                            <select name="tipo_comprobante">
                                <option value="boleta" selected>Boleta Electronica</option>
                                <option value="factura">Factura Electronica</option>
                                <option value="nota_credito">Nota de Credito</option>
                                <option value="nota_debito">Nota de Debito</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Numero Serie</label>
                            <input name="numero_serie" required placeholder="Ej: F001, B001">
                        </div>
                        <div class="form-group">
                            <label>Numero Comprobante</label>
                            <input name="numero_comprobante" required placeholder="Ej: 00000123">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Estado SUNAT</label>
                            <select name="estado_sunat">
                                <option value="pendiente" selected>Pendiente</option>
                                <option value="aceptado">Aceptado</option>
                                <option value="rechazado">Rechazado</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Fecha Envio SUNAT</label>
                            <input name="fecha_envio_sunat" type="datetime-local">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Respuesta SUNAT</label>
                        <textarea name="respuesta_sunat" placeholder="Mensaje de respuesta de SUNAT..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>XML Generado</label>
                        <textarea name="xml_generado" placeholder="Codigo XML de facturacion electronica..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>CDR Recibida</label>
                        <textarea name="cdr_recibida" placeholder="Constancia de recepcion de SUNAT..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/comprobantes_electronicos',
        [
            { field: 'id_comprobantes_electronicos', pk: true },
            { field: 'tipo_comprobante' },
            { field: 'numero_serie' },
            { field: 'numero_comprobante' },
            { field: 'id_ventas.numero_ticket', render: v => v || '-' },
            { field: 'estado_sunat' },
            { field: 'fecha_envio_sunat' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'tipo_comprobante', type: 'text' },
            { name: 'numero_serie', type: 'text' },
            { name: 'numero_comprobante', type: 'text' },
            { name: 'id_ventas', type: 'fk' },
            { name: 'estado_sunat', type: 'text' },
            { name: 'respuesta_sunat', type: 'text' },
            { name: 'fecha_envio_sunat', type: 'text' },
            { name: 'xml_generado', type: 'text' },
            { name: 'cdr_recibida', type: 'text' }
        ],
        [
            { field: 'id_ventas', api: '/api/ventas', label: 'numero_ticket' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_comprobantes_electronicos;
                const tipo = escapeHtml(row.tipo_comprobante || '-');
                const serie = escapeHtml(row.numero_serie || '-');
                const numero = escapeHtml(row.numero_comprobante || '-');
                const ticket = escapeHtml(val(row, 'id_ventas.numero_ticket', 'Venta'));
                const sunat = escapeHtml(row.estado_sunat || 'pendiente');
                const fecha = row.fecha_envio_sunat ? new Date(row.fecha_envio_sunat).toLocaleString() : '-';
                const fallback = tipo.slice(0, 2).toUpperCase();

                let sunatClass = 'badge-warning';
                if (sunat === 'aceptado') sunatClass = 'badge-active';
                else if (sunat === 'rechazado') sunatClass = 'badge-inactive';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${tipo.toUpperCase()}: ${serie}-${numero}</h4>
                                    <p>Ticket Venta: ${ticket}</p>
                                </div>
                                <span class="badge ${sunatClass}">${sunat.toUpperCase()}</span>
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Fecha Envio</span><strong>${fecha}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
