<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Productos</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Codigo</th>
                        <th>Nombre</th>
                        <th>Categoria</th>
                        <th>Marca</th>
                        <th>Precio Venta</th>
                        <th>Stock Min</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre del Producto</label>
                        <input name="nombre_producto" required placeholder="Nombre del producto">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Codigo Interno</label>
                            <input name="codigo_interno" placeholder="Codigo interno">
                        </div>
                        <div class="form-group">
                            <label>Codigo Barras</label>
                            <input name="codigo_barras" placeholder="Codigo de barras">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo Producto</label>
                            <input name="tipo_producto" placeholder="Ej: Cosmetico, Capilar">
                        </div>
                        <div class="form-group">
                            <label>Presentacion</label>
                            <input name="presentacion" placeholder="Ej: Caja, Frasco">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Categoria</label>
                            <select name="id_categorias_productos"></select>
                        </div>
                        <div class="form-group">
                            <label>Marca</label>
                            <select name="id_marcas"></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio Costo</label>
                            <input name="precio_costo" type="number" step="0.01" placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label>Precio Venta</label>
                            <input name="precio_venta" type="number" step="0.01" placeholder="0.00">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Stock Minimo</label>
                            <input name="stock_minimo" type="number" value="10">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Imagen URL</label>
                            <input name="img_url" placeholder="https://ejemplo.com/imagen.jpg">
                        </div>
                        <div class="form-group">
                            <label>Contenido Neto</label>
                            <input name="contenido_neto" placeholder="Ej: 500ml, 250g">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Descripcion del producto"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/productos',
        [
            { field: 'id_productos', pk: true },
            { field: 'codigo_interno' },
            { field: 'nombre_producto' },
            { field: 'id_categorias_productos.nombre_categoria_producto', render: v => v || '-' },
            { field: 'id_marcas.nombre_marca', render: v => v || '-' },
            { field: 'precio_venta', render: v => v != null ? 'S/ ' + parseFloat(v).toFixed(2) : '-' },
            { field: 'stock_minimo' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'codigo_interno', type: 'text' },
            { name: 'codigo_barras', type: 'text' },
            { name: 'nombre_producto', type: 'text' },
            { name: 'tipo_producto', type: 'text' },
            { name: 'presentacion', type: 'text' },
            { name: 'id_categorias_productos', type: 'fk' },
            { name: 'id_marcas', type: 'fk' },
            { name: 'precio_costo', type: 'decimal' },
            { name: 'precio_venta', type: 'decimal' },
            { name: 'stock_minimo', type: 'number' },
            { name: 'img_url', type: 'text' },
            { name: 'contenido_neto', type: 'text' },
            { name: 'descripcion', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_categorias_productos', api: '/api/categorias_productos', label: 'nombre_categoria_producto' },
            { field: 'id_marcas', api: '/api/marcas', label: 'nombre_marca' }
        ]
    );
    </script>
</div>
