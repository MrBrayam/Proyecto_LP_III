<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Sedes</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Sede</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre de la Sede</label>
                        <input name="nombre_sede" required placeholder="Nombre de la sede física">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Direccion</label>
                            <input name="direccion" required placeholder="Direccion de la sede">
                        </div>
                        <div class="form-group">
                            <label>Distrito</label>
                            <input name="distrito" placeholder="Ej: Miraflores, San Borja">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Telefono</label>
                            <input name="telefono" placeholder="Numero de contacto">
                        </div>
                        <div class="form-group">
                            <label>Responsable</label>
                            <input name="responsable" placeholder="Responsable o Gerente de Sede">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/sedes',
        [
            { field: 'id_sedes', pk: true },
            { field: 'nombre_sede' },
            { field: 'direccion' },
            { field: 'distrito' },
            { field: 'telefono' },
            { field: 'responsable' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_sede', type: 'text' },
            { name: 'direccion', type: 'text' },
            { name: 'distrito', type: 'text' },
            { name: 'telefono', type: 'text' },
            { name: 'responsable', type: 'text' },
            { name: 'estado', type: 'number' }
        ],
        [],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_sedes;
                const nombre = escapeHtml(row.nombre_sede || 'Sede');
                const direccion = escapeHtml(row.direccion || '-');
                const distrito = escapeHtml(row.distrito || '-');
                const tel = escapeHtml(row.telefono || '-');
                const responsable = escapeHtml(row.responsable || '-');
                const fallback = nombre.slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Activo</span>'
                    : '<span class="badge badge-inactive">Inactivo</span>';

                return `
                    <article class="entity-card">
                        <div class="entity-card__media"><div class="entity-card__fallback">${fallback}</div></div>
                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${nombre}</h4>
                                    <p>${direccion}, ${distrito}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Telefono</span><strong>${tel}</strong></div>
                                <div class="entity-card__meta-item"><span>Responsable</span><strong>${responsable}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
