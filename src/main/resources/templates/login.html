<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion - Bellarista</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h2>Bellarista</h2>
            <p class="subtitle">Sistema de Gestion</p>

            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form method="post" action="/admin/login">
                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required placeholder="Ingrese su correo">
                </div>
                <div class="form-group">
                    <label for="contrasenia">Contrasena</label>
                    <input type="password" id="contrasenia" name="contrasenia" required placeholder="Ingrese su contrasena">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px;">
                    Iniciar Sesion
                </button>
            </form>
        </div>
    </div>
</body>
</html>
