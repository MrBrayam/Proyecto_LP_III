<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Bellarista</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js?v=20260619-1"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Bellarista</h2>
                <button class="close-btn" id="closeBtn">x</button>
            </div>
            <nav class="sidebar-nav">
                <div class="menu-group">
                    <a href="/dashboard" style="display:block;padding:12px 20px;color:#555;text-decoration:none;font-size:14px;font-weight:500;">Dashboard</a>
                </div>

                <div class="menu-group">
                    <div class="menu-header">
                        <span>Productos</span>
                        <span class="arrow">></span>
                    </div>
                    <div class="menu-items">
                        <a href="/modulos/productos">Productos</a>
                        <a href="/modulos/categorias">Categorias</a>
                        <a href="/modulos/marcas">Marcas</a>
                    </div>
                </div>

                <div class="menu-group">
                    <div class="menu-header">
                        <span>Inventario</span>
                        <span class="arrow">></span>
                    </div>
                    <div class="menu-items">
                        <a href="/modulos/almacenes">Almacenes</a>
                        <a href="/modulos/lotes">Lotes de Inventario</a>
                        <a href="/modulos/movimientos">Movimientos</a>
                    </div>
                </div>

                <div class="menu-group">
                    <div class="menu-header">
                        <span>Promociones</span>
                        <span class="arrow">></span>
                    </div>
                    <div class="menu-items">
                        <a href="/modulos/combos">Combos Promocionales</a>
                        <a href="/modulos/promociones">Promociones</a>
                    </div>
                </div>
            </nav>
        </aside>

        <div class="main-content">
            <header class="topbar">
                <button class="hamburger" id="hamburgerBtn">=</button>
                <h1 th:text="${title}">Dashboard</h1>
                <div class="user-info">
                    <span th:text="${session.usuario?.nombre_usuario} ?: 'Usuario'"></span>
                    <a href="/logout" class="logout-btn">Salir</a>
                </div>
            </header>
            <main class="content">
                <div th:replace="~{${contentTemplate} :: content}"></div>
            </main>
        </div>
    </div>

</body>
</html>
