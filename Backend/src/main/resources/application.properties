spring.application.name=api
# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==========================================
# Para producción en cPanel (MySQL local al cPanel):
# spring.datasource.url=jdbc:mysql://localhost:3306/belleza_arista

# Para desarrollo local (conectándose a la base de datos remota de cPanel):
# spring.datasource.url=jdbc:mysql://15.204.230.215:3306/belleza_arista

spring.datasource.url=jdbc:mysql://localhost:3307/bellaaristav3
spring.datasource.username=root
#spring.datasource.username=root
#spring.datasource.password=Elcrack1xp352@
spring.datasource.password=
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
#server.port=2451
#spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Directorio de subida de archivos (imágenes)
# Para producción en cPanel:
#app.upload.dir=/home/belleza/public_html/api/uploads
# Para desarrollo local (carpeta 'uploads' en la raíz del proyecto):
app.upload.dir=uploads

# ==========================================
# CONFIGURACIÓN DE HIKARI (POOL DE CONEXIONES)
# ==========================================
# Evita advertencias de "Failed to validate connection" con la base de datos remota
# enviando un ping de "keepalive" cada 30 segundos
spring.datasource.hikari.keepalive-time=30000
# Define el tiempo máximo de vida de una conexión en el pool (9 minutos)
spring.datasource.hikari.max-lifetime=540000
# Tiempo de espera máximo para obtener una conexión (20 segundos)
spring.datasource.hikari.connection-timeout=20000