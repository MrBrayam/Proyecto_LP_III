<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Citas</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="entity-cards" id="data-cards"></div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nueva Cita</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <input type="hidden" name="id_usuarios_usuario_creacion" value="1">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Sede</label>
                            <select name="id_sedes" required></select>
                        </div>
                        <div class="form-group">
                            <label>Cliente</label>
                            <select name="id_clientes" required></select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Especialista (Estilista/Recepcionista)</label>
                            <select name="id_usuarios_especialista" required></select>
                        </div>
                        <div class="form-group">
                            <label>Fecha de la Cita</label>
                            <input name="fecha_cita" type="date" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Hora Inicio</label>
                            <input name="hora_inicio" type="time" required>
                        </div>
                        <div class="form-group">
                            <label>Hora Fin</label>
                            <input name="hora_fin" type="time" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Duracion (Minutos)</label>
                            <input name="duracion_minutos" type="number" placeholder="Ej: 60" required>
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Confirmada</option>
                                <option value="0">Pendiente / Cancelada</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observaciones</label>
                        <textarea name="observaciones" placeholder="Detalles de la cita..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/citas',
        [
            { field: 'id_citas', pk: true },
            { field: 'id_sedes.nombre_sede', render: v => v || '-' },
            { field: 'id_clientes.nombre_cliente', render: v => v || '-' },
            { field: 'id_usuarios_especialista.nombre_usuario', render: v => v || '-' },
            { field: 'fecha_cita' },
            { field: 'hora_inicio' },
            { field: 'hora_fin' },
            { field: 'duracion_minutos', render: v => v != null ? v + ' min' : '-' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_sedes', type: 'fk' },
            { name: 'id_clientes', type: 'fk' },
            { name: 'id_usuarios_especialista', type: 'fk' },
            { name: 'fecha_cita', type: 'text' },
            { name: 'hora_inicio', type: 'text' },
            { name: 'hora_fin', type: 'text' },
            { name: 'duracion_minutos', type: 'number' },
            { name: 'estado', type: 'number' },
            { name: 'observaciones', type: 'text' },
            { name: 'id_usuarios_usuario_creacion', type: 'fk' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' },
            { field: 'id_clientes', api: '/api/clientes', label: 'nombre_cliente' },
            { field: 'id_usuarios_especialista', api: '/api/usuarios', label: 'nombre_usuario' }
        ],
        {
            view: 'cards',
            cardRenderer: function(row) {
                const id = row.id_citas;
                const cliente = escapeHtml(val(row, 'id_clientes.nombre_cliente', 'Cliente') + ' ' + val(row, 'id_clientes.apellidos_clientes', ''));
                const especialista = escapeHtml(val(row, 'id_usuarios_especialista.nombre_usuario', 'Especialista') + ' ' + val(row, 'id_usuarios_especialista.apellidos_usuario', ''));
                const sede = escapeHtml(val(row, 'id_sedes.nombre_sede', '-'));
                const fecha = row.fecha_cita || '-';
                const hora = (row.hora_inicio || '-') + ' a ' + (row.hora_fin || '-');
                const duracion = row.duracion_minutos != null ? row.duracion_minutos + ' min' : '-';
                const obs = escapeHtml(row.observaciones || 'Sin observaciones');
                const fallback = (val(row, 'id_clientes.nombre_cliente', 'C')).slice(0, 2).toUpperCase();
                const estado = row.estado === 1 || row.estado === true
                    ? '<span class="badge badge-active">Confirmada</span>'
                    : '<span class="badge badge-inactive">Pendiente</span>';

                return `
                    <article class="entity-card">

                        <div class="entity-card__body">
                            <div class="entity-card__header">
                                <div>
                                    <h4>${cliente}</h4>
                                    <p>Sede: ${sede} | Esp: ${especialista}</p>
                                </div>
                                ${estado}
                            </div>
                            <div class="entity-card__meta">
                                <div class="entity-card__meta-item"><span>Fecha</span><strong>${fecha}</strong></div>
                                <div class="entity-card__meta-item"><span>Horario</span><strong>${hora} (${duracion})</strong></div>
                                <div class="entity-card__meta-item"><span>Notas</span><strong>${obs}</strong></div>
                            </div>
                            <div class="entity-card__actions">
                                <button class="btn btn-sm" onclick="crud.edit(${id})">Editar</button>
                                <button class="btn btn-sm btn-danger" onclick="crud.del(${id})">Eliminar</button>
                            </div>
                        </div>
                    </article>`;
            }
        }
    );
    </script>
</div>
