<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Almacenes</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nuevo</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Ubicacion</th>
                        <th>Capacidad Total</th>
                        <th>Stock Ocupado</th>
                        <th>Disponible (Resta)</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Sede</label>
                        <select name="id_sedes" required></select>
                    </div>
                    <div class="form-group">
                        <label>Nombre del Almacen</label>
                        <input name="nombre_almacen" required placeholder="Nombre del almacen">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ubicacion</label>
                            <input name="ubicacion" placeholder="Ubicacion">
                        </div>
                        <div class="form-group">
                            <label>Capacidad</label>
                            <input name="capacidad" type="number" placeholder="Capacidad">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select name="estado">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/almacenes',
        [
            { field: 'id_almacenes', pk: true },
            { field: 'nombre_almacen' },
            { field: 'ubicacion' },
            { field: 'capacidad', render: v => v != null ? v + ' und' : '0 und' },
            { field: 'ocupado', render: v => v != null ? v + ' und' : '0 und' },
            { field: 'disponible', render: v => (v != null ? v + ' und' : '0 und') + ' restante' },
            { field: 'estado', render: v => v === 1 ? 'Activo' : 'Inactivo' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'id_sedes', type: 'fk' },
            { name: 'nombre_almacen', type: 'text' },
            { name: 'ubicacion', type: 'text' },
            { name: 'capacidad', type: 'number' },
            { name: 'estado', type: 'number' }
        ],
        [
            { field: 'id_sedes', api: '/api/sedes', label: 'nombre_sede' }
        ]
    );
    </script>
</div>
