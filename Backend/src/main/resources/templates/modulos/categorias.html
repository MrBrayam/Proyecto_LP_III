<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Categorias de Productos</h3>
            <button class="btn btn-primary" onclick="crud.openNew()">+ Nueva</button>
        </div>
        <div class="loading">Cargando...</div>
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Orden</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" style="display:none;">No hay registros</div>
    </div>

    <div class="modal-overlay" id="entityModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Nuevo Registro</h3>
                <button class="modal-close" onclick="crud.closeModal()">x</button>
            </div>
            <div class="modal-body">
                <form id="entityForm" autocomplete="off">
                    <input type="hidden" name="id_tenants" value="1">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input name="nombre_categoria_producto" required placeholder="Nombre de la categoria">
                    </div>
                    <div class="form-group">
                        <label>Descripcion</label>
                        <textarea name="descripcion" placeholder="Descripcion"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Orden</label>
                            <input name="orden" type="number" placeholder="Orden">
                        </div>
                        <div class="form-group">
                            <label>Estado</label>
                            <select name="estado">
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="crud.closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="crud.save()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
    crud.init(
        '/api/categorias_productos',
        [
            { field: 'id_categorias_productos', pk: true },
            { field: 'nombre_categoria_producto' },
            { field: 'descripcion' },
            { field: 'orden' },
            { field: 'estado' },
            { field: 'acciones', actions: true }
        ],
        [
            { name: 'id_tenants', type: 'fk' },
            { name: 'nombre_categoria_producto', type: 'text' },
            { name: 'descripcion', type: 'text' },
            { name: 'orden', type: 'number' },
            { name: 'estado', type: 'number' }
        ]
    );
    </script>
</div>
